function handleLabFile(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var st = el("liStatus");
  st.textContent = "Reading " + file.name + "…";
  var name = file.name.toLowerCase();
  if (/\.pdf$/.test(name)) {
    readPdf(file).then(function (text) {
      el("liText").value = text;
      var d = detectDate(text); if (d && el("liDate")) el("liDate").value = d;
      st.innerHTML = 'Read ' + Math.round(text.length / 100) / 10 + 'k characters from the PDF. Press <b>Read it</b>.';
    })["catch"](function () {
      st.innerHTML = '<span style="color:var(--crit)">That PDF’s text couldn’t be read here.</span> Reading a PDF needs an internet connection the first time, and scans never work. Open the PDF, select all, copy, and paste into the box above instead.';
    });
    return;
  }
  var fr = new FileReader();
  fr.onload = function () {
    var text = String(fr.result || "");
    if (/\.json$/.test(name)) { st.innerHTML = 'That looks like a backup file — use <b>Import backup</b> under the gear icon instead.'; return; }
    el("liText").value = text;
    var d = detectDate(text); if (d && el("liDate")) el("liDate").value = d;
    st.innerHTML = 'Loaded ' + file.name + '. Press <b>Read it</b>.';
  };
  fr.onerror = function () { st.textContent = "Couldn't read that file."; };
  fr.readAsText(file);
}

function readPdf(file) {
  return new Promise(function (resolve, reject) {
    function go() {
      if (!window.pdfjsLib) return reject(new Error("no pdfjs"));
      try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch (e) {}
      var fr = new FileReader();
      fr.onload = function () {
        window.pdfjsLib.getDocument({ data: new Uint8Array(fr.result) }).promise.then(function (doc) {
          var pages = [];
          for (var i = 1; i <= Math.min(doc.numPages, 12); i++) pages.push(i);
          return Promise.all(pages.map(function (n) {
            return doc.getPage(n).then(function (p) { return p.getTextContent(); }).then(function (tc) {
              var lines = {}, out = [];
              tc.items.forEach(function (it) {
                var y = Math.round(it.transform[5]);
                (lines[y] = lines[y] || []).push(it.str);
              });
              Object.keys(lines).sort(function (a, b) { return b - a; }).forEach(function (y) { out.push(lines[y].join(" ")); });
              return out.join("\n");
            });
          }));
        }).then(function (parts) { resolve(parts.join("\n")); })["catch"](reject);
      };
      fr.onerror = reject;
      fr.readAsArrayBuffer(file);
    }
    if (window.pdfjsLib) return go();
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = go;
    s.onerror = function () { reject(new Error("cdn blocked")); };
    document.head.appendChild(s);
  });
}

/* ---------- getting a file out of the page ----------
   No browser anywhere reports whether a blob download was actually saved. On
   iOS Safari the entire path — Blob, createObjectURL, "download" in a,
   a.click() — succeeds while the file is silently discarded. So the return
   value below means one thing only: the request could be made. It never means
   she has the file, and nothing in this app treats it as if it did. */
function tryDownload(name, text, mime) {          // asked? — never: saved?
  try {
    if (!window.Blob || !window.URL || !URL.createObjectURL) return false;
    var a = document.createElement("a");
    if (!("download" in a)) return false;
    var blob = new Blob([text], { type: mime || "application/json" });
    var url = URL.createObjectURL(blob);
    a.href = url; a.download = name; a.rel = "noopener";
    a.style.position = "fixed"; a.style.left = "-9999px"; a.style.opacity = "0";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} if (a.parentNode) a.remove(); }, 4000);
    return true;
  } catch (e) { return false; }
}

var LAST_EXPORT = { name: "", text: "" };

/* Whether downloads actually arrive on this device. Asked once, then
   remembered, so the ordinary case is never two taps. Deliberately kept in
   localStorage rather than in STATE: it is a fact about this browser, and it
   must not travel inside a backup to a different one. */
var DL_KEY = "tfn-downloads-arrive";              // "" unknown | "ok" | "blocked"
function dlVerdict() { try { return localStorage.getItem(DL_KEY) || ""; } catch (e) { return ""; } }
function setDlVerdict(v) { try { localStorage.setItem(DL_KEY, v); } catch (e) {} }

var EXPORT_ASK = null;    // an export whose outcome is not settled yet

/* Only three things may stamp lastExport: she said the file arrived, she
   copied the text out, or downloads are already proven on this device. Calling
   click() without an exception is not one of them — that was the bug. */
function recordExport(stamp) {
  STATE.lastExport = stamp;
  STATE.remindAfter = null;
  STATE.seen = true;
  saveNow();
}
function exportSnapshot() { return { lastExport: STATE.lastExport, remindAfter: STATE.remindAfter, seen: STATE.seen }; }
function revertExport(p) {
  if (!p) return;
  STATE.lastExport = p.lastExport; STATE.remindAfter = p.remindAfter; STATE.seen = p.seen;
  saveNow();
}

function exportBackup(force) {
  var stamp = new Date().toISOString(), snapText;
  try { snapText = stringifyWith({ savedAt: stamp, lastExport: stamp }); }
  catch (e) { toast("Couldn't package the backup.", true); return; }
  LAST_EXPORT = { name: "field-notes-backup-" + todayISO() + ".json", text: snapText };
  // the outcome strip lives on the page, so get out of the way of it: an export
  // started from inside Setup would otherwise leave the question behind a scrim
  if (MODAL && MODAL !== "backupText") closeModal();

  var verdict = force ? "" : dlVerdict();
  if (verdict === "blocked") {
    // she has already told this app that files never turn up here; go straight
    // to the route that does work rather than staging a download for nobody
    EXPORT_ASK = null; paintNotices();
    openBackupText("blocked");
    return;
  }

  var prev = exportSnapshot();
  if (!tryDownload(LAST_EXPORT.name, LAST_EXPORT.text, "application/json")) {
    setDlVerdict("blocked");
    EXPORT_ASK = null; paintNotices();
    openBackupText("refused");
    return;
  }
  EXPORT_ASK = verdict === "ok"
    ? (recordExport(stamp), { name: LAST_EXPORT.name, at: stamp, mode: "assumed", prev: prev })
    : { name: LAST_EXPORT.name, at: stamp, mode: "ask", prev: prev };
  paintNotices();
}

/* The outcome of a backup does not belong in a toast. A toast is gone in twelve
   seconds; this is the one question in the app whose answer decides whether she
   has a copy of her log at all, so it stays on the page until it is settled. */
function exportNotice() {
  if (!EXPORT_ASK) return "";
  if (EXPORT_ASK.mode === "assumed") {
    return '<div class="remind noprint"><span class="grow">Saving <b>' + esc(EXPORT_ASK.name) + '</b>. ' +
      'Counted as your latest backup, because downloads have arrived on this device before.</span>' +
      '<button class="btn sm" data-a="exportNone">It didn\u2019t arrive</button>' +
      '<button class="btn sm ghost" data-a="exportDismiss">OK</button></div>';
  }
  return '<div class="note noprint"><b>Did the file arrive?</b><br>' +
    'The page asked your browser to save <b>' + esc(EXPORT_ASK.name) + '</b>. No browser ever tells a page whether ' +
    'that worked, so this one will not claim it did. Have a look in Files or Downloads, then say which happened \u2014 ' +
    'you are asked once, and the answer is remembered for this device.' +
    '<div class="row"><button class="btn sm pri" data-a="exportGot">I have the file</button>' +
    '<button class="btn sm" data-a="exportNone">Nothing appeared</button></div></div>';
}

/* A backup is a machine-readable file: pretty-printing it bought nothing and
   cost 44% more bytes to build, hold, escape and paint. */
function backupText() { return stringifyWith({ savedAt: new Date().toISOString() }); }

/* Putting the backup on the page was the slow part, and neither half of it was
   necessary. esc()'ing it walked the whole string looking for four characters
   that JSON.stringify has already escaped out of existence; concatenating it
   into innerHTML made the browser parse a megabyte of HTML to build one text
   node. A textarea's .value takes the string as-is, so the box opens on the
   next frame — after a paint, so the modal is on screen and reading
   "Packaging your backup" while it happens rather than freezing on the tap. */
function fillBackupText() {
  var run = function () {
    var n = el("exportText");
    if (!n) return;
    var text = LAST_EXPORT.text;
    if (!text) { try { text = backupText(); } catch (e) { text = ""; } }
    n.value = text;
    n.placeholder = "";
    var note = el("copyNote");
    if (note) note.textContent = text.length + " characters.";
    try { n.focus(); n.setSelectionRange(0, 0); } catch (e) {}
  };
  if (window.requestAnimationFrame) requestAnimationFrame(function () { setTimeout(run, 0); });
  else setTimeout(run, 0);
}

/* Backup-as-text: the route that works where downloads are refused, and the
   only one that ends in a signal a browser genuinely gives — a copy that
   succeeded. That is why a successful copy, and not a click(), sets lastExport. */
function openBackupText(reason) {
  var lead = reason === "refused"
    ? '<b>Your browser wouldn\u2019t start a file download.</b> Nothing is lost \u2014 this is the same backup, as text. '
    : reason === "blocked"
      ? '<b>Files don\u2019t arrive on this device</b>, you told the app so last time, so it is not going to pretend otherwise. Here is the same backup, as text. '
      : 'This is your whole log. ';
  openModal("backupText", "Backup as text",
    '<div class="hint" style="margin-bottom:10px">' + lead + 'Select it all and copy, then paste it into a note, an email to yourself, or a file. ' +
    'Copying counts as a backup \u2014 that one your browser does confirm. It restores through the box below.</div>' +
    '<textarea id="exportText" readonly spellcheck="false" placeholder="Packaging your backup\u2026"></textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn" data-a="copyBackup">Copy all</button>' +
    '<span class="hint" id="copyNote">Packaging\u2026</span></div>' +
    '<div class="sec"><span class="eyebrow">Restore from text</span></div>' +
    '<div class="hint" style="margin-bottom:8px">Paste a backup here to replace everything currently in the app.</div>' +
    '<textarea id="importText" placeholder="Paste a backup here" spellcheck="false" style="min-height:90px"></textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn danger" data-a="importText">Restore from this text</button></div>' +
    (reason === "blocked" ? '<div class="row" style="margin-top:14px"><button class="btn sm ghost" data-a="exportFile">Try a file download again</button></div>' : ''),
    '<span style="flex:1"></span><button class="btn pri" data-a="closeModal">Done</button>');
  fillBackupText();
}

function copyBackup() {
  var n = el("exportText"); if (!n) return;
  var note = el("copyNote");
  if (!n.value) { if (note) note.textContent = "Still packaging — try again in a second."; return; }
  function ok() {
    if (note) note.textContent = "Copied. Paste it somewhere safe now.";
    // the clipboard is one of the few things a browser reports honestly, so
    // this is a backup the app is entitled to count
    EXPORT_ASK = null;
    recordExport(new Date().toISOString());
    paintNotices();
  }
  function no() { if (note) note.textContent = "Couldn't copy for you — the text is selected, use your device's copy."; }
  try { n.readOnly = false; n.focus(); n.select(); n.setSelectionRange(0, n.value.length); n.readOnly = true; } catch (e) {}
  var did = false;
  try { did = document.execCommand("copy"); } catch (e) { did = false; }
  if (did) { ok(); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(n.value).then(ok)["catch"](no);
  } else no();
}

function applyBackup(p, sourceLabel) {
  if (!p || !p.v) { toast("That isn't a Field Notes backup.", true); return false; }
  STATE = migrate(p);
  FIRST_RUN = false;
  STATE.seen = true;
  saveNow();
  closeModal();
  render();
  toast("Backup restored" + (sourceLabel ? " from " + sourceLabel : "") + " and saved to this browser.");
  return true;
}

function importFromText() {
  var n = el("importText"); if (!n) return;
  var raw = n.value.trim();
  if (!raw) { toast("Paste the backup text first."); return; }
  var p = null;
  try { p = JSON.parse(raw); } catch (e) { toast("That text isn't a complete backup — make sure you copied all of it.", true); return; }
  if (!p || !p.v) { toast("That isn't a Field Notes backup.", true); return; }
  if (!confirm("Replace everything currently in the app with this backup?")) return;
  applyBackup(p, "text");
}

function download(name, text, mime) {
  if (dlVerdict() === "blocked") { toast("Files don\u2019t arrive on this device, so the CSV can\u2019t be saved here. Your backup still works as text, under the gear icon.", true); return; }
  if (tryDownload(name, text, mime)) { toast("Asked your browser to save " + name + ". Check Files or Downloads \u2014 the page can\u2019t see whether it landed."); return; }
  toast("This browser wouldn't start a download. Use Backup as text under the gear icon.", true);
}

/* Two records can carry the same name — an item stopped and started again
   months later is two rows, both "Iron bisglycinate", and two identical column
   headers make the CSV ambiguous the moment it reaches a spreadsheet. When a
   name repeats, every instance of it takes its start date, so the pair reads
   as the two runs it actually is. */
function suppColumns() {
  var base = STATE.supps.map(function (s) {
    return "supp_" + String(s.name || "item").replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "");
  });
  var counts = {};
  base.forEach(function (b) { counts[b] = (counts[b] || 0) + 1; });
  var used = {};
  return base.map(function (b, i) {
    var nm = counts[b] > 1 ? b + "_" + String(STATE.supps[i].start || "undated").replace(/-/g, "") : b;
    var t = nm, k = 2;
    while (used[t]) t = nm + "_" + (k++);
    used[t] = 1;
    return t;
  });
}

function exportCsv() {
  var syms = activeSymptoms();
  var head = ["date", "cycle_day", "bristol", "bm_count", "sleep_hours", "notes"].concat(syms.map(function (s) { return s.id; }))
    .concat(suppColumns());
  var dates = Object.keys(STATE.days).filter(function (dt) { return dayHasAnything(STATE.days[dt]); }).sort();
  var lines = [head.join(",")];
  dates.forEach(function (dt) {
    var d = STATE.days[dt];
    var row = [dt, cycleDay(dt) || "", (d.bristol || []).join(" "), (d.bristol || []).length, (d.sleep && d.sleep.hours) || "", '"' + String(d.notes || "").replace(/"/g, '""') + '"'];
    syms.forEach(function (s) { row.push(d.s && d.s[s.id] != null ? d.s[s.id] : ""); });
    STATE.supps.forEach(function (s) { row.push(d.supps && d.supps[s.id] ? d.supps[s.id] : ""); });
    lines.push(row.join(","));
  });
  download("thyroid-daily-log.csv", lines.join("\n"), "text/csv");
}

function handleImport(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    var p = null;
    try { p = JSON.parse(String(fr.result)); } catch (err) { toast("That file isn't a Field Notes backup.", true); return; }
    if (!p || !p.v) { toast("That file isn't a Field Notes backup.", true); return; }
    if (!confirm("Replace everything currently in the app with this backup? Export first if you're not sure.")) return;
    applyBackup(p, file.name);
  };
  fr.onerror = function () { toast("Couldn't read that file.", true); };
  fr.readAsText(file);
}

/* ============================================================
   Notices: first-run explanation, backup reminder, storage trouble
   ============================================================ */
function firstRunNote() {
  return '<div class="note" id="firstRun"><b>Before you start.</b> Everything you log here is kept in this browser, ' +
    'on this device \u2014 it never leaves it, and there is no account or internet involved. That also means this page is the only copy: ' +
    'clearing your browser\u2019s site data, or opening the file in a private window, would leave it empty. ' +
    'Exporting a backup file now and then is how you keep a copy of your own \u2014 the <b>Backup</b> button at the top does it, ' +
    'and this page will remind you when it has been a while.' +
    '<div class="row"><button class="btn sm pri" data-a="seenOk">Got it</button>' +
    '<button class="btn sm" data-a="export">Try a backup now</button></div></div>';
}

function backupReminder() {
  if (!hasData()) return "";
  if (STATE.remindAfter && todayISO() < STATE.remindAfter) return "";
  var since = STATE.lastExport || STATE.startedAt;
  var n = daysSince(since);
  if (n == null || n < 7) return "";
  var msg = STATE.lastExport
    ? "It has been " + n + " days since your last backup."
    : "You have " + n + " days of log here and no backup yet.";
  return '<div class="remind noprint"><span class="grow">' + msg + ' A backup is one file you can keep.</span>' +
    '<button class="btn sm pri" data-a="export">Export backup</button>' +
    '<button class="btn sm ghost" data-a="remindLater">Later</button></div>';
}

function storageWarning() {
  if (LS_OK) return "";
  return '<div class="banner noprint"><span class="grow"><b>This browser won\u2019t let the page store anything.</b> ' +
    'Nothing you type here will survive closing the tab. Try opening the file in Chrome, Safari or Firefox directly ' +
    '(not through a preview window), or export a backup before you close it.</span>' +
    '<button class="btn sm" data-a="export">Export now</button></div>';
}

function loadTrouble() {
  if (!LOAD_TROUBLE) return "";
  return '<div class="banner noprint"><span class="grow"><b>One stored copy couldn\u2019t be read</b> and was set aside rather than deleted. ' +
    'Check that your log looks complete. If anything is missing, import your most recent backup.</span></div>';
}

function paintNotices() {
  var host = el("noticeHost");
  if (!host) return;
  var html = storageWarning() + loadTrouble() + exportNotice();
  // one question at a time: while an export is unsettled, the first-run note and
  // the reminder would both be talking about the thing she is mid-way through
  if (!EXPORT_ASK) html += STATE.seen ? backupReminder() : firstRunNote();
  host.innerHTML = html;
}

/* ============================================================
   Confirmations
   ============================================================ */
var CONFIRM = null;
function openConfirm(title, msg, label, fn) {
  CONFIRM = fn;
  openModal("confirm", title, '<p style="font-size:14px;line-height:1.55">' + msg + '</p>',
    '<span style="flex:1"></span><button class="btn" data-a="closeModal">Cancel</button>' +
    '<button class="btn danger" data-a="confirmYes">' + esc(label) + '</button>');
}

/* ============================================================
   Actions
   ============================================================ */
function act(a, t) {
  var id = t.getAttribute("data-id"), v = t.getAttribute("data-v");
  var day;

  switch (a) {
    case "tab": VIEW = v; closeModal(); render(); window.scrollTo(0, 0); return;
    case "setup": openSetup(); return;
    case "closeModal": closeModal(); return;
    case "scrim": if (t === document.querySelector(".scrim")) closeModal(); return;
    case "confirmYes": { var f = CONFIRM; CONFIRM = null; closeModal(); if (f) f(); return; }
    case "print": window.print(); return;

    /* ---- date ---- */
    case "date": CUR = addDays(CUR, +v); if (CUR > todayISO()) CUR = todayISO(); render(); return;
    case "jumpToday": CUR = todayISO(); render(); return;
    case "openDay": CUR = v; VIEW = "today"; render(); window.scrollTo(0, 0); return;

    /* ---- symptoms ---- */
    case "rate": day = DW(CUR); day.s[id] = (day.s[id] === +v ? undefined : +v); if (day.s[id] === undefined) delete day.s[id]; markDirty(); render(); return;
    case "unrate": day = DW(CUR); delete day.s[id]; markDirty(); render(); return;
    case "noneAll":
      day = DW(CUR);
      activeSymptoms().forEach(function (s) { if (s.scale === "sev") day.s[s.id] = 1; });
      day.bmNone = true; day.noneAll = true;
      markDirty(); render(); toast("Marked every severity-rated symptom as None. Set energy, sleep quality and appetite when you get a chance."); return;
    case "bristol": day = DW(CUR); day.bristol.push(+v); day.bmNone = false; markDirty(); render(); return;
    case "bristolClear": day = DW(CUR); day.bristol = []; day.bmNone = false; markDirty(); render(); return;
    case "bmNone": day = DW(CUR); day.bristol = []; day.bmNone = !day.bmNone; markDirty(); render(); return;

    /* ---- library ---- */
    case "lib": openLib(); return;
    case "libToggle": {
      var s0 = byIdIn(STATE.symptoms, id);
      if (s0) { s0.active = !s0.active; markDirty(); }
      el("modalBody").innerHTML = libBody();
      render(); return;
    }
    case "symCustom":
      openModal("symCustom", "Add your own symptom",
        '<div class="fgrid"><div class="fld" style="grid-column:1/-1"><label class="f">Name</label><input type="text" id="scName" placeholder="Ear fullness"></div>' +
        '<div class="fld"><label class="f">Group</label><select id="scGroup">' + GROUP_ORDER.map(function (g) { return '<option' + (g === "My own" ? " selected" : "") + '>' + esc(g) + '</option>'; }).join("") + '</select></div>' +
        '<div class="fld"><label class="f">Scale</label><select id="scScale"><option value="sev">1 none → 5 severe</option><option value="pos">1 worst → 5 best</option><option value="div">1 too low → 3 normal → 5 too high</option></select></div></div>',
        '<span style="flex:1"></span><button class="btn" data-a="lib">Back</button><button class="btn pri" data-a="symCustomSave">Add</button>');
      return;
    case "symCustomSave": {
      var nm = mv("scName"); if (!nm) { toast("Give it a name first."); return; }
      STATE.symptoms.push({ id: "u_" + uid(), name: nm, group: mv("scGroup") || "My own", scale: el("scScale").value, labels: null, active: true, ord: 900 + STATE.symptoms.length, custom: true });
      markDirty(); openLib(); render(); return;
    }

    /* ---- supplements ---- */
    case "supp": day = DW(CUR); day.supps[id] = (day.supps[id] === v ? undefined : v); if (!day.supps[id]) delete day.supps[id]; markDirty(); render(); return;
    case "suppClear": day = DW(CUR); delete day.supps[id]; markDirty(); render(); return;
    case "suppAll": day = DW(CUR); suppsOn(CUR).forEach(function (s) { day.supps[s.id] = "taken"; }); markDirty(); render(); return;
    case "suppAdd": openSupp(null); return;
    case "suppEdit": openSupp(id); return;
    case "suppSave": {
      var name = mv("spName"); if (!name) { toast("Name it first."); return; }
      var rec = id ? byIdIn(STATE.supps, id) : null;
      var isNew = !rec;
      if (!rec) { rec = { id: uid(), changes: [] }; STATE.supps.push(rec); }
      rec.name = name; rec.dose = mv("spDose"); rec.freq = el("spFreq").value;
      rec.start = mv("spStart") || todayISO(); rec.end = mv("spEnd") || null; rec.notes = mv("spNote");
      // With no changes logged, the dose in the box IS the dose it started on.
      // Once changes exist, editing the box corrects the current dose only —
      // the start dose stays what it was.
      if (isNew || !(rec.changes || []).length) rec.dose0 = rec.dose;
      markDirty(); closeModal(); render();
      toast(isNew ? name + " added — it starts appearing on the daily page from " + fmtMed(rec.start) + "." : "Saved.");
      return;
    }
    case "suppStop": {
      var sp = byIdIn(STATE.supps, id);
      if (sp) { sp.end = todayISO(); markDirty(); closeModal(); render(); toast(sp.name + " stopped today. It stays in your history."); }
      return;
    }
    case "suppDel": {
      var sd = byIdIn(STATE.supps, id);
      openConfirm("Delete " + (sd ? sd.name : "item") + "?",
        "This erases it from every past day too. To keep the history and just come off it, use <b>Stop today</b> instead.",
        "Delete permanently", function () {
          STATE.supps = STATE.supps.filter(function (x) { return x.id !== id; });
          Object.keys(STATE.days).forEach(function (dt) { if (STATE.days[dt].supps) delete STATE.days[dt].supps[id]; });
          markDirty(); render();
        });
      return;
    }
    case "chgAdd": {
      var sc = byIdIn(STATE.supps, id); if (!sc) return;
      var to = mv("chTo"); if (!to) { toast("What did it change to?"); return; }
      sc.changes = sc.changes || [];
      // before the first change, the current dose IS the start dose — pin it
      // now so raising the dose can never rewrite what she started on
      if (sc.dose0 == null) sc.dose0 = sc.dose || "";
      sc.changes.push({ date: mv("chDate") || todayISO(), from: mv("chFrom"), to: to, note: mv("chNote") });
      sc.dose = currentDose(sc);
      markDirty(); openSupp(id); render(); return;
    }
    case "chgDel": {
      var sx = byIdIn(STATE.supps, id);
      if (sx && sx.changes) { var sorted = sortedChanges(sx); var target = sorted[+v]; sx.changes = sx.changes.filter(function (c) { return c !== target; }); sx.dose = currentDose(sx); markDirty(); openSupp(id); render(); }
      return;
    }

    /* ---- practices, activity, meals ---- */
    case "practice": day = DW(CUR); day.practice[id] = day.practice[id] ? undefined : true; if (!day.practice[id]) delete day.practice[id]; markDirty(); render(); return;
    case "actAdd": {
      var ty = mv("actType"); if (!ty) { toast("What kind of activity?"); return; }
      day = DW(CUR); day.act.push({ type: ty, min: num(mv("actMin")), intensity: el("actInt").value });
      clearDraft(day, ["actType", "actMin", "actInt"]);
      markDirty(); render(); return;
    }
    case "actDel": day = DW(CUR); day.act.splice(+v, 1); markDirty(); render(); return;
    case "mealAdd": {
      var wh = mv("mealWhat"); if (!wh) { toast("What did you eat?"); return; }
      day = DW(CUR); day.meals.push({ what: wh, time: mv("mealTime"), note: mv("mealNote") });
      clearDraft(day, ["mealWhat", "mealTime", "mealNote"]);
      markDirty(); render(); return;
    }
    case "mealDel": day = DW(CUR); day.meals.splice(+v, 1); markDirty(); render(); return;

    /* ---- cycles ---- */
    /* A new start never writes an end on the cycle before it: `end` is the day
       bleeding stopped, and starting a period today says nothing about that.
       The one thing it does say is that any bleeding already recorded cannot
       have run into this new cycle, so a stale end gets clamped. */
    case "cycleStart": {
      if (cycleByStart(CUR)) { toast("Already logged as a period start."); return; }
      var prevC = cycleFor(CUR);
      if (prevC && prevC.end && prevC.end >= CUR) prevC.end = addDays(CUR, -1);
      if (prevC && prevC.end && prevC.end < prevC.start) prevC.end = null;
      STATE.cycles.push({ id: uid(), start: CUR, end: null });
      sortCycles();
      markDirty(); render(); toast("Cycle day 1 set to " + fmtMed(CUR) + "."); return;
    }
    /* "Period ended" closes the bleeding on the cycle the shown date falls in —
       the current one when she is on today — and stops the count nowhere. */
    case "cycleEnd": {
      var oc = cycleFor(CUR) || currentCycle();
      if (!oc) { toast("Log the period start first."); return; }
      if (CUR < oc.start) { toast("That is before the period started."); return; }
      var nxs = nextCycleStart(oc);
      if (nxs && CUR >= nxs) { toast("That date already belongs to the next cycle."); return; }
      oc.end = CUR; markDirty(); render();
      toast((daysBetween(oc.start, CUR) + 1) + "-day period logged. The cycle day keeps counting.");
      return;
    }
    case "cycleList": openCycles(); return;
    /* Backfilling through the list has to be as safe as the button: no
       duplicate starts, no bleeding that runs into the cycle after it, and the
       array left in date order whatever order she enters them in. */
    case "cycleAdd": {
      var cs = mv("cyStart"); if (!cs) { toast("Pick a start date."); return; }
      if (cs > todayISO()) { toast("That start date is in the future."); return; }
      if (cycleByStart(cs)) { toast("A period is already logged as starting " + fmtMed(cs) + "."); return; }
      var ce = mv("cyEnd") || null;
      if (ce && ce < cs) { toast("Bleeding cannot have stopped before it started."); return; }
      var beforeC = null, afterC = null, sorted = cyclesSorted();
      for (var ci2 = 0; ci2 < sorted.length; ci2++) {
        if (sorted[ci2].start < cs) beforeC = sorted[ci2];
        else if (!afterC) afterC = sorted[ci2];
      }
      if (ce && afterC && ce >= afterC.start) { toast("That end runs into the period logged on " + fmtMed(afterC.start) + "."); return; }
      if (beforeC && beforeC.end && beforeC.end >= cs) beforeC.end = addDays(cs, -1);
      if (beforeC && beforeC.end && beforeC.end < beforeC.start) beforeC.end = null;
      STATE.cycles.push({ id: uid(), start: cs, end: ce });
      sortCycles();
      markDirty(); openCycles(); render(); return;
    }
    case "cycleDel": STATE.cycles = STATE.cycles.filter(function (c) { return c.id !== id; }); markDirty(); openCycles(); render(); return;
    case "cycleSym": return;

    /* ---- events ---- */
    case "eventAdd": openEvent(null); return;
    case "eventEdit": openEvent(id); return;
    case "eventSave": {
      var lb = mv("evLabel"); if (!lb) { toast("What changed?"); return; }
      var evx = id ? byIdIn(STATE.events, id) : null;
      if (evx) {
        evx.date = mv("evDate") || evx.date;
        evx.cat = el("evCat").value;
        evx.label = lb;
        evx.detail = mv("evDetail");
      } else {
        STATE.events.push({ id: uid(), date: mv("evDate") || todayISO(), cat: el("evCat").value, label: lb, detail: mv("evDetail") });
      }
      markDirty(); closeModal(); render(); return;
    }
    case "eventDel": {
      var evd = byIdIn(STATE.events, id);
      openConfirm("Remove this line?", "\u201C" + esc(evd ? evd.label : "This change") + "\u201D will be taken off the change log. Nothing else you have logged is touched.", "Remove", function () {
        STATE.events = STATE.events.filter(function (x) { return x.id !== id; });
        markDirty(); render();
      });
      return;
    }

    /* ---- markers & labs ---- */
    case "pickMarker": UI.labMarker = id; UI.labEvAll = false; render(); return;
    case "labEvAll": UI.labEvAll = !UI.labEvAll; render(); return;
    case "markerAdd": openMarker(); return;
    case "markerSave": {
      var mn = mv("mkName"); if (!mn) { toast("Name the marker."); return; }
      var mk = ensureMarker(mn, mv("mkUnit"));
      mk.sl = mv("mkSl"); mk.sh = mv("mkSh"); mk.fl = mv("mkFl"); mk.fh = mv("mkFh");
      UI.labMarker = mk.id; markDirty(); closeModal(); render(); return;
    }
    case "markerPreset": {
      var added = 0;
      THYROID_CORE.forEach(function (n) {
        if (findMarkerByName(n)) return;
        var p = null; MARKER_PRESETS.forEach(function (x) { if (x[0] === n) p = x; });
        ensureMarker(n, p ? p[1] : ""); added++;
      });
      markDirty(); render();
      toast(added ? added + " markers added. Enter your ranges on each one." : "Those markers are already set up.");
      return;
    }
    case "markerDel": {
      var md = byIdIn(STATE.markers, id);
      openConfirm("Delete " + (md ? md.name : "marker") + "?", "Its " + markerResults(id).length + " result(s) go with it.", "Delete", function () {
        STATE.markers = STATE.markers.filter(function (x) { return x.id !== id; });
        STATE.labs = STATE.labs.filter(function (x) { return x.markerId !== id; });
        UI.labMarker = STATE.markers.length ? STATE.markers[0].id : null;
        markDirty(); render();
      });
      return;
    }
    case "labAdd": openLabAdd(); return;
    case "labSave": {
      var val = num(mv("laVal")); if (val == null) { toast("Enter a number."); return; }
      STATE.labs.push({ id: uid(), markerId: el("laMk").value, date: mv("laDate") || todayISO(), value: val, lab: mv("laLab"), note: mv("laNote") });
      UI.labMarker = el("laMk").value;
      markDirty(); closeModal(); render(); return;
    }
    case "labDel": STATE.labs = STATE.labs.filter(function (x) { return x.id !== id; }); markDirty(); render(); return;
    case "labImport": openLabImport(); return;
    case "liParse": {
      var txt = el("liText").value;
      if (!txt.trim()) { el("liStatus").textContent = "Paste the report text, or choose a file above."; return; }
      var rows = /,|\t/.test(txt.split("\n")[0]) && parseLabCSV(txt).length >= parseLabText(txt).length ? parseLabCSV(txt) : parseLabText(txt);
      var typed = mv("liDate");
      var det = detectDate(txt);
      var dt = (typed && typed !== todayISO()) ? typed : (det || typed || todayISO());
      showParsed(rows, dt, mv("liLab"));
      return;
    }
    case "liCommit": {
      var host = el("modalBody"), n = 0;
      var boxes = host.querySelectorAll("[data-pi]");
      for (var i = 0; i < boxes.length; i++) {
        var pi = +boxes[i].getAttribute("data-pi"), pf = boxes[i].getAttribute("data-pf");
        if (!PARSED[pi]) continue;
        PARSED[pi][pf] = boxes[i].type === "checkbox" ? boxes[i].checked : boxes[i].value;
      }
      PARSED.forEach(function (r) {
        if (!r.use) return;
        var vv = num(r.value); if (vv == null) return;
        var mk2 = ensureMarker(r.name, r.unit);
        if (r.applyRange && r.lo && !mk2.sl && !mk2.sh) { mk2.sl = r.lo; mk2.sh = r.hi; }
        var dd = r.date || (el("pDate") && el("pDate").value) || v;
        var dupe = STATE.labs.filter(function (x) { return x.markerId === mk2.id && x.date === dd; })[0];
        if (dupe) { dupe.value = vv; } else { STATE.labs.push({ id: uid(), markerId: mk2.id, date: dd, value: vv, lab: id || "", note: "" }); }
        n++;
      });
      markDirty(); closeModal(); render();
      toast(n + " result" + (n === 1 ? "" : "s") + " added.");
      return;
    }

    /* ---- summary ---- */
    case "qAdd":
      openModal("q", "Add a question", '<div class="fld"><label class="f">Question for your RD, endo or PCP</label>' +
        '<textarea id="qText" placeholder="Is the afternoon crash worth splitting the dose?"></textarea></div>',
        '<span style="flex:1"></span><button class="btn" data-a="closeModal">Cancel</button><button class="btn pri" data-a="qSave">Add</button>');
      return;
    case "qSave": {
      var qt = mv("qText"); if (!qt) { toast("Type the question."); return; }
      STATE.questions.push({ id: uid(), text: qt, created: todayISO() });
      markDirty(); closeModal(); render(); return;
    }
    case "qDel": STATE.questions = STATE.questions.filter(function (x) { return x.id !== id; }); markDirty(); render(); return;
    case "copySummary": {
      var txt2 = summaryText();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt2).then(function () { toast("Summary copied."); })["catch"](function () { toast("Couldn't copy — use Print instead."); });
      } else toast("Copying isn't available here — use Print / save as PDF.");
      return;
    }
    case "apptAdd": openSetup(); return;
    case "apptSave": {
      var ad = mv("apDate"); if (!ad) { toast("Pick a date."); return; }
      STATE.appts.push({ id: uid(), date: ad, who: mv("apWho"), note: mv("apNote") });
      markDirty(); openSetup(); render(); return;
    }
    case "apptDel": STATE.appts = STATE.appts.filter(function (x) { return x.id !== id; }); markDirty(); openSetup(); render(); return;

    /* ---- data ---- */
    case "export": exportBackup(); return;
    case "exportFile": closeModal(); exportBackup(true); return;   // ignore a stored "blocked" once
    /* The two answers to "did the file arrive?". Only the first one is allowed
       to stamp lastExport, which is what makes the 7-day reminder mean
       something again. */
    case "exportGot":
      setDlVerdict("ok");
      if (EXPORT_ASK) recordExport(EXPORT_ASK.at);
      EXPORT_ASK = null; paintNotices();
      toast("Recorded. Keep that file somewhere that isn\u2019t this phone.");
      return;
    case "exportNone":
      setDlVerdict("blocked");
      // an assumed stamp was written on evidence that just turned out to be
      // wrong, so take it back rather than leave a backup on the books
      if (EXPORT_ASK && EXPORT_ASK.mode === "assumed") revertExport(EXPORT_ASK.prev);
      EXPORT_ASK = null; paintNotices();
      openBackupText("refused");
      return;
    case "exportDismiss": EXPORT_ASK = null; paintNotices(); return;
    case "backupText": openBackupText(); return;
    case "copyBackup": copyBackup(); return;
    case "importText": importFromText(); return;
    case "exportCsv": exportCsv(); return;
    case "seenOk": STATE.seen = true; markDirty(); paintNotices(); return;
    case "remindLater": STATE.remindAfter = addDays(todayISO(), 3); markDirty(); paintNotices(); return;
    case "theme":
      if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem("tfn-theme", v || ""); } catch (e) {}
      return;
    case "setupSave": STATE.profile.name = mv("pfName"); markDirty(); closeModal(); render(); return;
  }
}

/* ============================================================
   Wiring
   ============================================================ */
function wire() {
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-a]") : null;
    if (!t) return;
    var a = t.getAttribute("data-a");
    if (a === "setDate" || a === "trendDays" || a === "trendGroup" || a === "cmpEvent" || a === "cmpWin" || a === "cycleSym") return;
    if (a === "scrim" && e.target !== t) return;
    e.preventDefault();
    act(a, t);
  });

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("data-draft")) { saveDraft(t); return; }
    var a = t.getAttribute && t.getAttribute("data-a");
    if (a === "setDate") { if (t.value) { CUR = t.value; render(); } return; }
    if (a === "trendDays") { UI.trendDays = +t.value; render(); return; }
    if (a === "trendGroup") { UI.trendGroup = t.value; render(); return; }
    if (a === "cmpEvent") { UI.cmpEvent = t.value; render(); return; }
    if (a === "cmpWin") { UI.cmpWin = +t.value; render(); return; }
    if (a === "cycleSym") { UI.cyclePhaseSym = t.value; render(); return; }
    if (t.id === "mkPreset" && t.value) {
      var p = t.value.split("|");
      if (el("mkName") && !el("mkName").value) el("mkName").value = p[0];
      if (el("mkUnit") && !el("mkUnit").value) el("mkUnit").value = p[1] || "";
      return;
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute("data-draft")) { saveDraft(t); return; }
    var path = t.getAttribute && t.getAttribute("data-in");
    if (path) {
      var day = DW(CUR);
      if (path === "notes") day.notes = t.value;
      else if (path.indexOf("sleep.") === 0) {
        var k = path.split(".")[1];
        var val = (k === "hours" || k === "wakes") ? num(t.value) : t.value;
        if (val === "" || val == null) delete day.sleep[k]; else day.sleep[k] = val;
      }
      markDirty(); return;
    }
    var mk = t.getAttribute && t.getAttribute("data-mk");
    if (mk) {
      var m = byIdIn(STATE.markers, t.getAttribute("data-id"));
      if (m) { m[mk] = t.value.trim(); markDirty(); }
      return;
    }
    if (t.id === "libQ") { UI.libQuery = t.value; var b = el("modalBody"); if (b) { b.innerHTML = libBody(); var n = el("libQ"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } } return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && MODAL) { closeModal(); return; }
    if (MODAL || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (VIEW === "today" && e.key === "ArrowLeft") { CUR = addDays(CUR, -1); render(); }
    if (VIEW === "today" && e.key === "ArrowRight" && CUR < todayISO()) { CUR = addDays(CUR, 1); render(); }
  });

  /* No "are you sure" dialog: saving is automatic. These just make sure a
     debounced save lands before the page is backgrounded or closed. */
  window.addEventListener("pagehide", flushSave);
  window.addEventListener("beforeunload", flushSave);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushSave();
  });
}

/* ============================================================
   Boot
   ============================================================ */
function boot() {
  try { var th = localStorage.getItem("tfn-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  loadState();
  buildShell();
  wire();
  render();
  recoverFromIdb();

  // keep "Saved 3 min ago" honest without touching the data
  setInterval(function () { if (SAVE_STATUS !== "pending") paintSaveBar(); }, 60000);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>

<script>
/* Registered last so a worker problem can never stop the app loading. */
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
