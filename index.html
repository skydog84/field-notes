<style id="app-css">
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ff-sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}

:root{
  color-scheme:light;
  --ff-sans:Archivo,"Archivo Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --ff-serif:Newsreader,"Newsreader Variable",Georgia,"Iowan Old Style","Times New Roman","Noto Serif",Cambria,serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono","Courier New",monospace;
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#F7F8F7; --surface-3:#EBEEED;
  --ink:#161F1E; --ink-2:#4C5957; --ink-3:#788683;
  --line:#DCE2E0; --line-2:#C4CCCA;
  --accent:#14706A; --accent-soft:#E0EFED; --accent-ink:#0B534E;
  --flag:#A9531F; --flag-soft:#F7E8DC; --flag-line:#DDA97F;
  --good:#2C7A5C; --warn:#9C6B15; --crit:#A0442C;
  --s1:#F1EDEA; --s2:#EFD9C9; --s3:#E4B295; --s4:#CE8260; --s5:#A5482F;
  --s1i:#4C5957; --s2i:#4A3527; --s3i:#3B2417; --s4i:#FFFFFF; --s5i:#FFFFFF;
  --p1:#ECEFEE; --p2:#CBE0DA; --p3:#9BCBC0; --p4:#57AA9C; --p5:#1B7B6E;
  --p1i:#4C5957; --p2i:#20423C; --p3i:#12322C; --p4i:#FFFFFF; --p5i:#FFFFFF;
  --d1:#43789F; --d2:#A6C2D6; --d3:#E4E2DD; --d4:#E4B295; --d5:#BC6742;
  --d1i:#FFFFFF; --d2i:#1E3241; --d3i:#3D4746; --d4i:#3B2417; --d5i:#FFFFFF;
  --shadow:0 1px 2px rgba(16,30,28,.05), 0 8px 24px -16px rgba(16,30,28,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1414; --surface:#161E1D; --surface-2:#1C2524; --surface-3:#232D2C;
    --ink:#E6ECEA; --ink-2:#A6B3B0; --ink-3:#778582;
    --line:#293332; --line-2:#3A4645;
    --accent:#4FB0A6; --accent-soft:#15302D; --accent-ink:#7CCDC4;
    --flag:#E08A55; --flag-soft:#301F16; --flag-line:#6B4527;
    --good:#54A87D; --warn:#D3A24A; --crit:#D0694D;
    --s1:#242C2B; --s2:#40322A; --s3:#5F422E; --s4:#875233; --s5:#AC5E3B;
    --s1i:#A6B3B0; --s2i:#E7D6C8; --s3i:#F3DECD; --s4i:#FBEADC; --s5i:#FFFFFF;
    --p1:#242C2B; --p2:#28403C; --p3:#2E5B53; --p4:#2B7A6D; --p5:#43A093;
    --p1i:#A6B3B0; --p2i:#CDE4DF; --p3i:#DCF0EB; --p4i:#EAF7F4; --p5i:#08211E;
    --d1:#3A6A8E; --d2:#2C4658; --d3:#31393A; --d4:#784C31; --d5:#A75937;
    --d1i:#EAF2F8; --d2i:#C6DAE7; --d3i:#A6B3B0; --d4i:#F6E3D5; --d5i:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1414; --surface:#161E1D; --surface-2:#1C2524; --surface-3:#232D2C;
  --ink:#E6ECEA; --ink-2:#A6B3B0; --ink-3:#778582;
  --line:#293332; --line-2:#3A4645;
  --accent:#4FB0A6; --accent-soft:#15302D; --accent-ink:#7CCDC4;
  --flag:#E08A55; --flag-soft:#301F16; --flag-line:#6B4527;
  --good:#54A87D; --warn:#D3A24A; --crit:#D0694D;
  --s1:#242C2B; --s2:#40322A; --s3:#5F422E; --s4:#875233; --s5:#AC5E3B;
  --s1i:#A6B3B0; --s2i:#E7D6C8; --s3i:#F3DECD; --s4i:#FBEADC; --s5i:#FFFFFF;
  --p1:#242C2B; --p2:#28403C; --p3:#2E5B53; --p4:#2B7A6D; --p5:#43A093;
  --p1i:#A6B3B0; --p2i:#CDE4DF; --p3i:#DCF0EB; --p4i:#EAF7F4; --p5i:#08211E;
  --d1:#3A6A8E; --d2:#2C4658; --d3:#31393A; --d4:#784C31; --d5:#A75937;
  --d1i:#EAF2F8; --d2i:#C6DAE7; --d3i:#A6B3B0; --d4i:#F6E3D5; --d5i:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

body{background:var(--bg);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--ff-serif)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{max-width:940px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--ff-serif);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.brand span{display:block;font-family:var(--ff-sans);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.hdr-sp{flex:1}
.savebar{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.dirty{background:var(--flag)}
.savetxt{font-size:11px;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
@media(max-width:520px){.savetxt{display:none}}

/* ---------- buttons ---------- */
/* Touch targets. 44px is Apple's minimum and the one number a thumb actually
   feels. inline-flex is what lets a <label class="btn"> honour a min-height at
   all. Small buttons keep their small type and radius, so they still read as
   secondary — they are just no longer 26px of hittable page. */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:7px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;line-height:1.2;transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px;min-height:44px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--line-2)}
.btn.danger:hover{border-color:var(--crit);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.icon{appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px;border-radius:5px;line-height:1;font-size:15px;
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.icon:hover{background:var(--surface-3);color:var(--ink)}
/* A file input has to be rendered to be reliably clickable through its label on
   iOS; display:none (which is what [hidden] means) has never been dependable
   there. Rendered, one pixel across, invisible, and out of flow instead. */
.vh{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;padding:0;margin:0;border:0}
label.btn{overflow:hidden}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px}
.tab{flex:1;appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.02em}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]:hover{color:var(--accent)}
@media(min-width:760px){
  .sym{display:grid;grid-template-columns:1fr minmax(280px,340px);gap:20px;align-items:center}
  .sym-top{margin-bottom:0}
  .sym .hint{grid-column:1/-1;margin-top:0}
  .tri .chip{min-width:60px}
  body{padding-bottom:40px}
  .tabs{position:static;border-top:0;border-bottom:1px solid var(--line);background:var(--bg);max-width:940px;margin:0 auto;padding:0 16px;gap:2px}
  .tab{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:11px 13px;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab[aria-selected="true"]{border-bottom-color:var(--accent)}
}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.card-h h2{font-family:var(--ff-serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{font-size:12px;color:var(--ink-3);margin-left:auto;text-align:right}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:12px}
.hint{font-size:12px;color:var(--ink-3);line-height:1.45}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.empty{text-align:center;padding:26px 16px;color:var(--ink-3);font-size:13px;line-height:1.6}

/* ---------- date bar ---------- */
.datebar{display:flex;align-items:center;gap:8px;padding:12px 0 4px}
.datebar .d-main{flex:1;text-align:center;min-width:0}
.d-day{font-family:var(--ff-serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.d-meta{font-size:11px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;font-weight:600;margin-top:2px}
.d-nav{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);width:44px;height:44px;border-radius:9px;cursor:pointer;font-size:16px;flex:none;display:flex;align-items:center;justify-content:center}
.d-nav:hover{border-color:var(--ink-3);color:var(--ink)}
.d-nav:disabled{opacity:.35;cursor:default}

/* ---------- symptom rows ---------- */
.sym{padding:11px 0;border-bottom:1px solid var(--line)}
.sym:last-child{border-bottom:0}
.sym-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sym-name{font-size:14px;font-weight:500;flex:1;min-width:0}
.sym-val{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.25;max-width:44%}

.chip{flex:1;min-width:0;appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:7px;min-height:44px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:transform .08s}

.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{border-color:transparent;box-shadow:0 0 0 1.5px var(--ink) inset}
.chip[aria-pressed="true"] .dim{color:currentColor;opacity:.72}
.chip.n{flex:0 0 auto;padding:0 11px;font-size:12px;font-weight:600;letter-spacing:.02em}
/* the named low end of a severity row: keep five across at 390px */
.scale .chip.n{max-width:38%;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:44px;text-align:center}
.sc1[aria-pressed="true"]{background:var(--s1);color:var(--s1i)}.sc2[aria-pressed="true"]{background:var(--s2);color:var(--s2i)}.sc3[aria-pressed="true"]{background:var(--s3);color:var(--s3i)}.sc4[aria-pressed="true"]{background:var(--s4);color:var(--s4i)}.sc5[aria-pressed="true"]{background:var(--s5);color:var(--s5i)}
.pc1[aria-pressed="true"]{background:var(--p1);color:var(--p1i)}.pc2[aria-pressed="true"]{background:var(--p2);color:var(--p2i)}.pc3[aria-pressed="true"]{background:var(--p3);color:var(--p3i)}.pc4[aria-pressed="true"]{background:var(--p4);color:var(--p4i)}.pc5[aria-pressed="true"]{background:var(--p5);color:var(--p5i)}
.dc1[aria-pressed="true"]{background:var(--d1);color:var(--d1i)}.dc2[aria-pressed="true"]{background:var(--d2);color:var(--d2i)}.dc3[aria-pressed="true"]{background:var(--d3);color:var(--d3i)}.dc4[aria-pressed="true"]{background:var(--d4);color:var(--d4i)}.dc5[aria-pressed="true"]{background:var(--d5);color:var(--d5i)}

/* ---------- three-state (supplements) ---------- */
.tri{display:flex;gap:5px;flex:none}
.tri .chip{min-width:52px;min-height:44px;font-size:12px;flex:none;padding:0 10px}
.tri .chip.took[aria-pressed="true"]{background:var(--p4);color:var(--p4i);box-shadow:none}
.tri .chip.miss[aria-pressed="true"]{background:var(--s4);color:var(--s4i);box-shadow:none}
.supp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.supp-row:last-child{border-bottom:0}
.supp-nm{flex:1;min-width:130px;font-size:14px;font-weight:500}
.supp-nm small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:1px}
/* meds list: status pill and Edit travel together, and never sit alongside the
   adherence line on a narrow screen */
.med-act{display:flex;align-items:center;gap:8px;flex:none}
.ad-line{line-height:1.45}
.ad-line .mono{white-space:normal}
@media(max-width:560px){
  .supp-row.med{align-items:flex-start}
  .supp-row.med .supp-nm{flex:1 1 100%;min-width:0}
  .supp-row.med .med-act{width:100%;justify-content:flex-start;margin-top:2px}
}

/* ---------- daily-log tap targets ----------
   44px everywhere she taps to log a day. Scoped to the daily page so modal
   footers, table row actions and the header keep their own scale. */
[data-view="today"] .btn{min-height:44px}
[data-view="today"] .btn.sm{min-height:44px;padding-top:8px;padding-bottom:8px}
[data-view="today"] input,[data-view="today"] select{min-height:44px}
[data-view="today"] .sym .icon,[data-view="today"] .supp-row .icon{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}

/* ---------- pills / tags ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2)}
.pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.pill.flagp{background:var(--flag-soft);border-color:var(--flag-line);color:var(--flag)}
.pill.good{background:transparent;border-color:var(--good);color:var(--good)}
.pill.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.pill.crit{background:transparent;border-color:var(--crit);color:var(--crit)}

/* ---------- forms ---------- */
label.f{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
/* 16px, everywhere, no exceptions. iOS Safari zooms the whole page in the moment
   a field smaller than that takes focus, and it never zooms back out — so a
   15.5px field costs her a pinch-to-fit on every note, every sleep number and
   every lab value she types. The catch-all is deliberate: it covers file and
   checkbox inputs and anything added later without a matching rule. */
input,select,textarea{font-size:16px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:9px 10px;font-size:16px;color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fgrid.two{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.fld{min-width:0}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--ff-mono);font-variant-numeric:tabular-nums}

/* ---------- heatmap ---------- */
/* the strip opens on today; these mark the history that is off to the left */
.hmwrap{position:relative}
.hmfade{position:absolute;top:0;bottom:4px;width:26px;pointer-events:none;z-index:3;opacity:0;transition:opacity .18s;
  background:linear-gradient(to right,var(--surface) 35%,rgba(0,0,0,0))}
.hmfade::after{content:"\2039";position:absolute;left:1px;top:50%;transform:translateY(-50%);font-size:16px;line-height:1;font-weight:700;color:var(--ink-3)}
.hmwrap.sl .hmfade{opacity:1}
.hm{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.hm-grid{display:grid;gap:2px;min-width:max-content}
.hm-lbl{font-size:11.5px;color:var(--ink-2);padding-right:10px;white-space:nowrap;display:flex;align-items:center;position:sticky;left:0;background:var(--surface);z-index:2}
.hm-c{width:15px;height:15px;border-radius:3px;background:var(--surface-3);cursor:pointer;border:0;padding:0}
.hm-c.miss{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hm-d{font-size:9px;color:var(--ink-3);text-align:center;font-family:var(--ff-mono);height:14px}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:12px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:4px}

/* ---------- chart ---------- */
.chartbox{position:relative}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font-family:var(--ff-mono);font-size:9.5px;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font-size:12px;box-shadow:var(--shadow);z-index:5;min-width:120px;line-height:1.4}
.tip b{font-family:var(--ff-mono);font-size:14px;font-weight:500}

/* ---------- bars (before/after) ---------- */
.ba{display:grid;grid-template-columns:minmax(96px,1.2fr) 1fr auto;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ba:last-child{border-bottom:0}
.ba-nm{font-size:13px}
.ba-track{position:relative;height:16px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.ba-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.ba-fill{position:absolute;top:2px;bottom:2px;border-radius:2px}
.ba-num{font-family:var(--ff-mono);font-size:12px;text-align:right;white-space:nowrap;min-width:78px}

.scrim{position:fixed;inset:0;background:rgba(10,18,17,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;cursor:pointer}
.modal{cursor:auto}
@media(min-width:640px){.scrim{align-items:center;padding:24px}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;box-shadow:var(--shadow)}
@media(min-width:640px){.modal{border-radius:12px}}
.modal-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.modal-h h3{font-family:var(--ff-serif);font-size:18px;font-weight:600;flex:1}
.modal-b{padding:16px}
.modal-f{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;justify-content:flex-end}

.libgrp{margin-bottom:4px}
.libgrp h4{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:12px 0 6px}
.libitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}

.addbtn{appearance:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:17px;line-height:1;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;position:relative}

   these hit areas sit inside their own row and never steal a neighbour's tap. */
.addbtn::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.addbtn:hover{background:var(--accent);color:#fff}
.addbtn.rm{border-color:var(--line-2);color:var(--ink-3)}
.addbtn.rm:hover{background:var(--crit);border-color:var(--crit);color:#fff}

/* ---------- banner ---------- */
.banner{background:var(--flag-soft);border:1px solid var(--flag-line);color:var(--ink);border-radius:9px;padding:11px 13px;margin:12px 0;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.45}

/* ---------- report ---------- */
.report{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 22px}
.report h1{font-family:var(--ff-serif);font-size:27px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.report h2{font-family:var(--ff-serif);font-size:16px;font-weight:600;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.report p,.report li{font-size:13.5px;line-height:1.6}
.report ul{margin:0}
.report li{padding:4px 0 4px 16px;position:relative}
.report li::before{content:"";position:absolute;left:2px;top:11px;width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.rmeta{font-size:12px;color:var(--ink-3);margin-top:6px}
.rrule{height:2px;background:var(--ink);margin:14px 0 0;opacity:.85}
/* Each heading and the block under it are one <section class="rsec">, so the
   print rule below has something real to keep together. */
#exportText{min-height:190px;font-family:var(--ff-mono);font-size:16px;line-height:1.35;white-space:pre;overflow-wrap:normal}

/* ---------- offline build: notes, backup reminder, export text ---------- */
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:9px;padding:13px 15px;margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.note b{color:var(--ink)}
.note .row{margin-top:10px}
.remind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;padding:9px 12px;
  background:var(--accent-soft);border:1px solid transparent;border-radius:8px;font-size:12.5px;color:var(--accent-ink)}
.remind .grow{min-width:140px}
/* #exportText now lives in the shared stylesheet: both builds have the
   backup-as-text box, and its 16px is part of the no-iOS-zoom rule. */
.savetxt.err{color:var(--crit)}
.savetxt2{display:none;font-size:11px;color:var(--ink-3);letter-spacing:.02em;padding:7px 0 0;text-align:right}
.savetxt2.err{color:var(--crit);font-weight:600}
@media(max-width:520px){.savetxt2{display:block}}
.dot.err{background:var(--crit)}
@media print{.note,.remind{display:none!important}}

@media print{
  body{background:#fff;padding:0}
  .hdr,.tabs,.noprint{display:none!important}
  .report{border:0;padding:0;border-radius:0}
  /* The printed summary is .report/#reportEl — it contains no .card at all, so
     the old .card rule protected nothing and Labs, Symptoms that moved most and
     Questions to ask could split across a page break. */
  .report .rsec{break-inside:avoid;page-break-inside:avoid}
  .report h2{break-after:avoid;page-break-after:avoid}
  .report p,.report li,.report table{break-inside:avoid;page-break-inside:avoid}
  .card{break-inside:avoid}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function blankState() {

  // which a dose change overwrote — so every dated surface claimed she had

     - the previous "Period started" path closed the running cycle by writing

       when bleeding stopped, and it printed as "26 day period" in the list.
       It carries an exact fingerprint — ends the day before the next start,
       over a bleed length no period reaches — so put those back to unknown.

/* If localStorage came back empty but IndexedDB still has a copy (site data

    if (hasData()) return;                       // she has already started typing

function hasData() {
  if (!STATE) return false;

    (STATE.labs || []).length > 0 || (STATE.supps || []).length > 0 ||
    (STATE.cycles || []).length > 0 || (STATE.events || []).length > 0 ||
    (STATE.questions || []).length > 0;

/* ---------------- persistence: this browser, this device ---------------- */
function saveNow() {

  if (!STATE) return;

  catch (e) { SAVE_STATUS = "error"; SAVE_ERR = "Couldn't package this save"; paintSaveBar(); return; }

  var ok = false;
  try { localStorage.setItem(LS_KEY, txt); ok = (localStorage.getItem(LS_KEY) === txt); }
  catch (e) { ok = false; }

  if (ok) {
    // only now is it safe to overwrite the second copy
    try { localStorage.setItem(LS_KEY_B, txt); } catch (e) {}

    SAVE_STATUS = "saved"; SAVE_ERR = "";

    SAVE_STATUS = "error";

/* ---------------- cycle ----------------

   one thing only: the day the bleeding stopped. It is not the end of the cycle.

   the luteal stretch — the part worth reading acne and insomnia against — keeps
   its number long after the period is over.

                     period is logged)
     period length = end − start + 1           (knowable the moment bleeding
                     stops; a different number, labelled differently)

   forgotten would otherwise reach "day 300" and read as fact. CYCLE_MAX_DAY is

function periodLength(c) { return c && c.end && c.end >= c.start ? daysBetween(c.start, c.end) + 1 : null; }

   outlines that reads as "broken". Open them on today instead, and mark the
   fact that there is more history off to the left.

   Every one of those three things — measuring the sticky label column, reading
   scrollWidth, reading scrollLeft — forced a synchronous layout of the whole
   grid from inside the click handler that had just rebuilt it. At 90 days that
   is ~1,800 cells laid out twice on the critical path of every render, and
   render runs on every symptom tap. So: nothing is read here any more. The
   label width is remembered per strip and only written; the reads happen in a
   rAF, which runs after the click handler has returned but still before the

   it is seen, and a label that grew is corrected for free out of a layout the

    '<div class="row" style="gap:6px">' + prChips + '</div>' +
    '<div class="hint" style="margin-top:9px">Long list? Add minutes in the notes field below if the duration matters for a given day.</div></div>';

  var acts = (day && day.act) || [];
  var actRows = acts.map(function (a, i) {
    return '<div class="supp-row"><div class="supp-nm">' + esc(a.type || "Activity") + '<small>' + esc([(a.min ? a.min + " min" : ""), a.intensity].filter(Boolean).join(" · ")) + '</small></div>' +
      '<button class="btn sm danger" data-a="actDel" data-v="' + i + '">Remove</button></div>';
  }).join("");
  var actPending = draftAny(iso, ["actType", "actMin", "actInt"]);
  var effOpt = function (o) { return '<option' + (dr.actInt === o ? " selected" : "") + '>' + o + '</option>'; };
  var actCard = '<div class="card"><div class="card-h"><h2>Activity</h2></div>' + (actRows || '<div class="empty">Nothing logged.</div>') +
    '<div class="fgrid" style="margin-top:12px"><div class="fld"><label class="f">What</label><input type="text" id="actType" data-draft="actType" value="' + esc(dr.actType || "") + '" placeholder="Walk, lifting, PT…"></div>' +
    '<div class="fld"><label class="f">Minutes</label><input type="number" id="actMin" data-draft="actMin" value="' + esc(dr.actMin || "") + '" min="0" placeholder="30"></div>' +
    '<div class="fld"><label class="f">Effort</label><select id="actInt" data-draft="actInt"><option value="">—</option>' + effOpt("Easy") + effOpt("Moderate") + effOpt("Hard") + '</select></div></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn sm" data-a="actAdd">Add activity</button>' +
    (actPending ? '<span class="hint">Typed but not added yet — kept with ' + (isToday ? "today" : esc(fmtShort(iso))) + ' until you add it.</span>' : '') +
    '</div></div>';

  var meals = (day && day.meals) || [];
  var mealRows = meals.map(function (m, i) {
    return '<div class="supp-row"><div class="supp-nm">' + esc(m.what || "Meal") + '<small>' + esc([m.time, m.note].filter(Boolean).join(" · ")) + '</small></div>' +
      '<button class="btn sm danger" data-a="mealDel" data-v="' + i + '">Remove</button></div>';
  }).join("");
  var mealPending = draftAny(iso, ["mealWhat", "mealTime", "mealNote"]);
  var mealCard = '<div class="card"><div class="card-h"><h2>Meals</h2><span class="sub">' + meals.length + ' logged</span></div>' +
    (mealRows || '<div class="empty">Nothing logged.</div>') +
    '<div class="fgrid" style="margin-top:12px"><div class="fld" style="grid-column:1/-1"><label class="f">What you ate</label><input type="text" id="mealWhat" data-draft="mealWhat" value="' + esc(dr.mealWhat || "") + '" placeholder="Eggs, rice, spinach, olive oil"></div>' +
    '<div class="fld"><label class="f">Time</label><input type="time" id="mealTime" data-draft="mealTime" value="' + esc(dr.mealTime || "") + '"></div>' +
    '<div class="fld" style="grid-column:span 2"><label class="f">Note (optional)</label><input type="text" id="mealNote" data-draft="mealNote" value="' + esc(dr.mealNote || "") + '" placeholder="Ate out / new food / rushed"></div></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn sm" data-a="mealAdd">Add meal</button>' +
    (mealPending ? '<span class="hint">Typed but not added yet — kept with ' + (isToday ? "today" : esc(fmtShort(iso))) + ' until you add it.</span>' : '') +
    '</div></div>';

  var notesCard = '<div class="card"><div class="card-h"><h2>Notes for this day</h2></div>' +
    '<textarea data-in="notes" placeholder="Anything worth remembering — a flare, a bad night, travel, a new food, a stressful call.">' + esc((day && day.notes) || "") + '</textarea></div>';

  var addBtn = '<div class="row" style="margin:18px 0 0"><button class="btn" data-a="lib">＋ Add or remove symptoms</button>' +
    '<span class="hint">' + activeSymptoms().length + ' tracked</span></div>';

  return head + quick + cycleCard + suppBlockToday(iso) + symptomBlock(iso) + addBtn +
    '<div class="sec"><span class="eyebrow">Inputs</span></div>' +
    practiceCard + actCard + mealCard + notesCard +

/* ============================================================
   Trends
   ============================================================ */
function heatmap(days) {
  var syms = activeSymptoms();
  if (UI.trendGroup !== "all") syms = syms.filter(function (s) { return s.group === UI.trendGroup; });
  var to = todayISO(), from = addDays(to, -(days - 1));
  var dates = [];
  for (var d = from; d <= to; d = addDays(d, 1)) dates.push(d);

  var evs = changeEvents().filter(function (e) { return e.date >= from && e.date <= to; });
  var evByDate = {}; evs.forEach(function (e) { (evByDate[e.date] = evByDate[e.date] || []).push(e); });

  var cols = "max-content repeat(" + dates.length + ", 15px)";
  var html = '<div class="hmwrap" data-strip="sym-' + esc(UI.trendGroup) + '"><div class="hm"><div class="hm-grid" style="grid-template-columns:' + cols + '">';

  // date ticks
  html += '<div class="hm-lbl"></div>';
  dates.forEach(function (dt, i) {
    var show = i === 0 || i === dates.length - 1 || parseISO(dt).getDate() === 1 || (i % 7 === 0);
    html += '<div class="hm-d">' + (show ? parseISO(dt).getDate() : "") + '</div>';
  });

  // change strip
  html += '<div class="hm-lbl" style="font-weight:600;color:var(--flag)">Changes</div>';
  dates.forEach(function (dt) {
    var e = evByDate[dt];
    html += e
      ? '<button class="hm-c" data-a="openDay" data-v="' + dt + '" title="' + esc(e.map(function (x) { return catLabel(x.kind) + ": " + x.label; }).join(" · ")) + '" style="background:var(--flag)"></button>'
      : '<div class="hm-c miss" style="cursor:default"></div>';
  });

  // cycle strip
  if (STATE.cycles.length) {
    html += '<div class="hm-lbl" style="font-weight:600">Cycle</div>';
    dates.forEach(function (dt) {
      var n = cycleDay(dt);
      html += n
        ? '<button class="hm-c" data-a="openDay" data-v="' + dt + '" title="' + fmtMed(dt) + ' — cycle day ' + n + ' (' + cyclePhase(n) + ')" style="background:var(--' + (n <= 5 ? "d5" : n <= 13 ? "d2" : n <= 16 ? "p3" : "d4") + ')"></button>'
        : '<div class="hm-c miss" style="cursor:default"></div>';
    });
  }

  syms.forEach(function (s) {
    html += '<div class="hm-lbl">' + esc(s.name) + '</div>';
    var vr = scaleVar(s), labels = scaleLabels(s);
    dates.forEach(function (dt) {
      var day = D(dt), v = day && day.s ? day.s[s.id] : undefined;
      if (v == null) html += '<button class="hm-c miss" data-a="openDay" data-v="' + dt + '" title="' + fmtMed(dt) + ' — not logged"></button>';
      else html += '<button class="hm-c" data-a="openDay" data-v="' + dt + '" title="' + fmtMed(dt) + ' — ' + esc(s.name) + ': ' + esc(labels[v - 1]) + '" style="background:var(--' + vr + v + ')"></button>';
    });
  });

  html += '</div></div><div class="hmfade" aria-hidden="true"></div></div>';

  html += '<div class="legend"><span>Severity</span>' +
    [1, 2, 3, 4, 5].map(function (i) { return '<span><i style="background:var(--s' + i + ')"></i>' + SEV[i - 1] + '</span>'; }).join("") +
    '<span style="margin-left:6px"><i class="hm-c miss" style="box-shadow:inset 0 0 0 1px var(--line-2)"></i>Not logged</span>' +
    '<span><i style="background:var(--flag)"></i>Change</span></div>' +
    '<div class="hint" style="margin-top:8px">The grid opens on today — scroll left for earlier days. Tap any square to open that day. A pale square means you logged <b>none</b>; an empty outline means the day was never logged — the difference is the whole point.</div>';
  return html;
}

function coverageStats(days) {
  var to = todayISO(), from = addDays(to, -(days - 1)), logged = 0, none = 0, total = 0;
  for (var d = from; d <= to; d = addDays(d, 1)) {
    total++;
    var day = D(d);
    if (dayHasAnything(day)) logged++;
    if (day && day.noneAll) none++;
  }
  return { logged: logged, total: total, none: none };
}

function compareBlock() {
  var evs = changeEvents();
  if (!evs.length) {
    return '<div class="card"><div class="card-h"><h2>Before &amp; after a change</h2></div>' +
      '<div class="empty">Add a supplement, a dose change, or a diet change and this fills in automatically —<br>it lines up your symptoms in the window before and after that date.<br>' +
      '<button class="btn sm" data-a="eventAdd" style="margin-top:10px">Log a change</button></div></div>';
  }
  var sel = UI.cmpEvent;
  if (!sel) { sel = evs[evs.length - 1].date + "|" + evs[evs.length - 1].label; UI.cmpEvent = sel; }
  var opts = evs.slice().reverse().map(function (e) {
    var key = e.date + "|" + e.label;
    return '<option value="' + esc(key) + '"' + (key === sel ? " selected" : "") + '>' + esc(fmtMed(e.date) + " — " + e.label) + '</option>';
  }).join("");
  var wins = [7, 14, 30].map(function (w) { return '<option value="' + w + '"' + (w === UI.cmpWin ? " selected" : "") + '>' + w + ' days</option>'; }).join("");

  var parts = sel.split("|"), evDate = parts[0], evLabel = parts.slice(1).join("|");
  var w = UI.cmpWin;
  var beforeFrom = addDays(evDate, -w), beforeTo = addDays(evDate, -1);
  var afterFrom = evDate, afterTo = addDays(evDate, w - 1);
  if (afterTo > todayISO()) afterTo = todayISO();

  var rows = [];
  activeSymptoms().forEach(function (s) {
    var b = meanOf(seriesFor(s.id, beforeFrom, beforeTo));
    var a = meanOf(seriesFor(s.id, afterFrom, afterTo));
    if (b.n < 2 || a.n < 2) return;
    var delta = a.mean - b.mean;
    var better = s.scale === "pos" ? delta > 0 : s.scale === "div" ? Math.abs(a.mean - 3) < Math.abs(b.mean - 3) : delta < 0;
    rows.push({ s: s, b: b, a: a, delta: delta, better: better, mag: Math.abs(delta) });
  });
  rows.sort(function (x, y) { return y.mag - x.mag; });

  var afterDays = daysBetween(afterFrom, afterTo) + 1;
  var body;
  if (!rows.length) {
    body = '<div class="empty">Not enough logged days on both sides of ' + esc(fmtMed(evDate)) + ' yet.<br>Each symptom needs at least 2 logged days in the ' + w + '-day window before and after.</div>';
  } else {
    body = rows.slice(0, 14).map(function (r) {
      var pct = clamp(r.mag / 4, 0, 1) * 50;
      var left = r.delta < 0 ? (50 - pct) : 50;
      var color = r.mag < 0.25 ? "var(--line-2)" : r.better ? "var(--p4)" : "var(--s4)";
      return '<div class="ba"><div class="ba-nm">' + esc(r.s.name) + '</div>' +
        '<div class="ba-track"><div class="ba-mid"></div><div class="ba-fill" style="left:' + left + '%;width:' + pct + '%;background:' + color + '"></div></div>' +
        '<div class="ba-num" style="color:' + (r.mag < 0.25 ? "var(--ink-3)" : r.better ? "var(--good)" : "var(--crit)") + '">' +
        round(r.b.mean, 1) + ' → ' + round(r.a.mean, 1) + '</div></div>';
    }).join("");
  }

  return '<div class="card"><div class="card-h"><h2>Before &amp; after a change</h2></div>' +
    '<div class="fgrid" style="margin-bottom:14px"><div class="fld" style="grid-column:1/-1"><label class="f">Change</label><select data-a="cmpEvent">' + opts + '</select></div>' +
    '<div class="fld"><label class="f">Window each side</label><select data-a="cmpWin">' + wins + '</select></div></div>' +
    '<div class="hint" style="margin-bottom:10px">Mean rating in the ' + w + ' days before ' + esc(fmtMed(evDate)) + ' vs. the ' + afterDays + ' day' + (afterDays === 1 ? "" : "s") + ' from that date on. ' +
    'Bars left of center mean the number went down. Colour says whether that is an improvement for that symptom.</div>' +
    body +
    '<div class="hint" style="margin-top:12px"><b>Read this as a lead, not a cause.</b> Cycle phase, sleep, a stomach bug and the season all move at the same time. Take the top movers to your RD or endo as questions.</div></div>';
}

function cyclePhaseBlock() {
  if (!STATE.cycles.length) return "";
  var syms = activeSymptoms();
  if (!syms.length) return "";
  var symId = UI.cyclePhaseSym || (byIdIn(syms, "acne") ? "acne" : syms[0].id);
  var sym = byIdIn(STATE.symptoms, symId) || syms[0];
  var opts = syms.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sym.id ? " selected" : "") + '>' + esc(s.name) + '</option>'; }).join("");

  var buckets = { Menstrual: [], Follicular: [], Ovulatory: [], Luteal: [] };
  Object.keys(STATE.days).forEach(function (dt) {
    var v = STATE.days[dt].s ? STATE.days[dt].s[sym.id] : null;
    if (v == null) return;
    var ph = cyclePhase(cycleDay(dt));
    if (ph) buckets[ph].push(v);
  });
  var names = ["Menstrual", "Follicular", "Ovulatory", "Luteal"];
  var any = names.some(function (n) { return buckets[n].length; });
  var vr = scaleVar(sym);
  var body = any ? names.map(function (n) {
    var arr = buckets[n], m = arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null;
    var pct = m ? ((m - 1) / 4) * 100 : 0;
    return '<div class="ba"><div class="ba-nm">' + n + ' <span class="dim tiny">(day ' + (n === "Menstrual" ? "1–5" : n === "Follicular" ? "6–13" : n === "Ovulatory" ? "14–16" : "17+") + ')</span></div>' +
      '<div class="ba-track">' + (m ? '<div class="ba-fill" style="left:0;width:' + pct + '%;background:var(--' + vr + Math.max(1, Math.round(m)) + ')"></div>' : '') + '</div>' +
      '<div class="ba-num">' + (m ? round(m, 1) + ' <span class="dim">· ' + arr.length + 'd</span>' : '<span class="dim">no data</span>') + '</div></div>';
  }).join("")
    : '<div class="empty">No logged day with a rating for <b>' + esc(sym.name) + '</b> falls inside a recorded cycle yet.<br>Another symptom may already have enough — switch it above.</div>';

  return '<div class="card"><div class="card-h"><h2>By cycle phase</h2></div>' +
    '<div class="fld" style="margin-bottom:12px"><label class="f">Symptom</label><select data-a="cycleSym">' + opts + '</select></div>' +
    body + '<div class="hint" style="margin-top:10px">Averages across every logged day that falls in a recorded cycle — the whole cycle, not just the days you were bleeding. ' +
    'Phases use standard day ranges counted from your logged period start: useful for spotting a pattern, not for dating ovulation. ' +
    'Days more than ' + CYCLE_MAX_DAY + ' after a start with no newer start logged are left out rather than guessed at.</div></div>';
}

function viewTrends() {

  var groups = ["all"].concat(GROUP_ORDER.filter(function (g) {
    return activeSymptoms().some(function (s) { return s.group === g; });
  }));
  var gOpts = groups.map(function (g) { return '<option value="' + esc(g) + '"' + (g === UI.trendGroup ? " selected" : "") + '>' + (g === "all" ? "All symptoms" : esc(g)) + '</option>'; }).join("");
  var dOpts = [14, 30, 60, 90].map(function (d) { return '<option value="' + d + '"' + (d === UI.trendDays ? " selected" : "") + '>Last ' + d + ' days</option>'; }).join("");

  var recent = changeEvents().filter(function (e) { return e.date >= addDays(todayISO(), -90); }).reverse().slice(0, 14);
  var recentHtml = recent.length ? recent.map(function (e) {
    return '<li style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)"><span class="mono tiny dim" style="flex:none;width:56px">' + fmtShort(e.date) + '</span>' +
      '<span class="grow"><b style="font-weight:500">' + esc(e.label) + '</b>' + (e.detail ? '<br><span class="tiny dim">' + esc(e.detail) + '</span>' : '') + '</span>' +
      '<span style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px">' +
      '<span class="pill flagp">' + catLabel(e.kind) + '</span>' +
      '<button class="btn sm ghost" data-a="' + (e.manual ? 'eventEdit' : 'suppEdit') + '" data-id="' + e.ref + '">Edit</button>' +
      '</span></li>';
  }).join("") : '<li class="empty">No changes logged in the last 90 days.</li>';

  return '<div class="sec" style="margin-top:14px"><span class="eyebrow">Patterns</span></div>' +
    '<div class="card"><div class="card-h"><h2>Symptom grid</h2><span class="sub">' + cov.logged + ' of ' + cov.total + ' days logged</span></div>' +
    '<div class="row" style="margin-bottom:14px"><select data-a="trendDays" style="width:auto">' + dOpts + '</select>' +
    '<select data-a="trendGroup" style="width:auto">' + gOpts + '</select></div>' +
    heatmap(UI.trendDays) + '</div>' +
    compareBlock() +
    cyclePhaseBlock() +
    '<div class="card"><div class="card-h"><h2>Change log</h2>' +
    '<span class="sub"><button class="btn sm" data-a="eventAdd">Log a change</button></span></div><ul>' + recentHtml + '</ul>' +
    '<div class="hint" style="margin-top:10px">Supplement starts, stops and dose changes appear here automatically. Add diet changes, illnesses and appointments by hand. <b>Edit</b> changes or removes any line \u2014 the ones you typed open here, the ones from a supplement open that supplement.</div></div>' +
    '<div style="height:24px"></div>';
}

/* ============================================================
   Labs
   ============================================================ */
var MARKER_PRESETS = [
  ["TSH", "uIU/mL"], ["Free T4", "ng/dL"], ["Free T3", "pg/mL"],
  ["Reverse T3", "ng/dL"], ["TPO antibodies", "IU/mL"], ["Thyroglobulin antibodies", "IU/mL"],
  ["Total T4", "ug/dL"], ["Total T3", "ng/dL"],
  ["Ferritin", "ng/mL"], ["Vitamin D, 25-OH", "ng/mL"], ["Vitamin B12", "pg/mL"],
  ["Folate", "ng/mL"], ["hs-CRP", "mg/L"], ["Selenium", "ug/L"], ["Zinc", "ug/dL"],
  ["Magnesium, RBC", "mg/dL"], ["Iron", "ug/dL"], ["TIBC", "ug/dL"],
  ["Transferrin saturation", "%"], ["Hemoglobin A1c", "%"], ["Glucose, fasting", "mg/dL"],
  ["Cortisol, AM", "ug/dL"]
];
var THYROID_CORE = ["TSH", "Free T4", "Free T3", "Reverse T3", "TPO antibodies", "Thyroglobulin antibodies"];

/* order matters — longest / most specific first */
var ALIASES = [
  ["Reverse T3", "ng/dL", /reverse\s*t\s*-?\s*3|\brt-?3\b/i],
  ["Free T4", "ng/dL", /free\s*t\s*-?\s*4|t\s*-?\s*4[,\s]*free|\bft-?4\b/i],
  ["Free T3", "pg/mL", /free\s*t\s*-?\s*3|t\s*-?\s*3[,\s]*free|\bft-?3\b/i],
  ["Total T4", "ug/dL", /total\s*t\s*-?\s*4|t\s*-?\s*4[,\s]*total|thyroxine/i],
  ["Total T3", "ng/dL", /total\s*t\s*-?\s*3|t\s*-?\s*3[,\s]*total|triiodothyronine/i],
  ["TPO antibodies", "IU/mL", /thyroid\s*peroxidase|\btpo\b/i],
  ["Thyroglobulin antibodies", "IU/mL", /thyroglobulin\s*(ab|antibod)|\btg\s*ab\b|\btgab\b|anti-?\s*tg\b/i],
  ["Thyroid stimulating immunoglobulin", "%", /\btsi\b|stimulating\s*immunoglobulin/i],
  ["TSH", "uIU/mL", /\btsh\b|thyroid\s*stimulating\s*hormone|thyrotropin/i],
  ["Ferritin", "ng/mL", /ferritin/i],
  ["Vitamin D, 25-OH", "ng/mL", /25\s*-?\s*oh|vitamin\s*d|calcidiol/i],
  ["Vitamin B12", "pg/mL", /b\s*-?\s*12|cobalamin/i],
  ["Folate", "ng/mL", /folate|folic/i],
  ["hs-CRP", "mg/L", /hs\s*-?\s*crp|c\s*-?\s*reactive/i],
  ["Selenium", "ug/L", /selenium/i],
  ["Zinc", "ug/dL", /\bzinc\b/i],
  ["Magnesium, RBC", "mg/dL", /magnesium/i],
  ["TIBC", "ug/dL", /\btibc\b|iron\s*binding/i],
  ["Transferrin saturation", "%", /transferrin\s*sat|iron\s*sat|\bsat%|\bsaturation\b/i],
  ["Iron", "ug/dL", /\biron\b/i],
  ["Hemoglobin A1c", "%", /a1c|glycohemoglobin|hba1c/i],
  ["Glucose, fasting", "mg/dL", /glucose/i],
  ["Cortisol, AM", "ug/dL", /cortisol/i]
];

function findMarkerByName(name) {
  var n = String(name).toLowerCase().replace(/[^a-z0-9]/g, "");
  for (var i = 0; i < STATE.markers.length; i++) {
    if (STATE.markers[i].name.toLowerCase().replace(/[^a-z0-9]/g, "") === n) return STATE.markers[i];
  }
  return null;
}
function ensureMarker(name, unit) {
  var m = findMarkerByName(name);
  if (m) return m;
  m = { id: uid(), name: name, unit: unit || "", sl: "", sh: "", fl: "", fh: "", ord: STATE.markers.length };
  STATE.markers.push(m);
  return m;
}

/* ---------- parsing pasted lab text ---------- */
function detectDate(text) {
  var m = text.match(/\b(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\b/);
  if (m) return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  m = text.match(/\b(\d{1,2})[-/](\d{1,2})[-/](20\d{2})\b/);
  if (m) return m[3] + "-" + pad(+m[1]) + "-" + pad(+m[2]);
  m = text.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2}),?\s+(20\d{2})\b/i);
  if (m) {
    var mi = MON.map(function (x) { return x.toLowerCase(); }).indexOf(m[1].slice(0, 3).toLowerCase());
    if (mi >= 0) return m[3] + "-" + pad(mi + 1) + "-" + pad(+m[2]);
  }
  return null;
}

function parseLabText(text) {
  var lines = String(text).replace(/\r/g, "").split("\n"), out = [], seen = {};
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line || line.length > 220) continue;
    for (var a = 0; a < ALIASES.length; a++) {
      var al = ALIASES[a], m = line.match(al[2]);
      if (!m) continue;
      if (seen[al[0]]) break;
      var rest = line.slice(m.index + m[0].length);
      if (!/\d/.test(rest) && i + 1 < lines.length) rest = lines[i + 1];
      var rangeLo = null, rangeHi = null;
      var rm = rest.match(/(\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*(\d+(?:\.\d+)?)/);
      if (rm) { rangeLo = rm[1]; rangeHi = rm[2]; rest = rest.replace(rm[0], " "); }
      var vm = rest.match(/(<|>)?\s*(\d+(?:\.\d+)?)/);
      if (!vm) break;
      var unit = "";
      var um = rest.match(/(uIU\/mL|mIU\/L|ng\/dL|pg\/mL|ng\/mL|ug\/dL|ug\/L|IU\/mL|mg\/L|mg\/dL|mcg\/dL|%)/i);
      if (um) unit = um[1];
      out.push({ use: true, name: al[0], unit: unit || al[1], value: vm[2], lo: rangeLo, hi: rangeHi, raw: line });
      seen[al[0]] = 1;
      break;
    }
  }
  return out;
}

function parseLabCSV(text) {
  var lines = String(text).replace(/\r/g, "").split("\n").filter(function (l) { return l.trim(); });
  if (!lines.length) return [];
  var out = [], start = 0;
  var head = lines[0].toLowerCase();
  var hasHead = /date|marker|test|value|result/.test(head);
  if (hasHead) start = 1;
  for (var i = start; i < lines.length; i++) {
    var c = lines[i].split(/[,\t;]/).map(function (x) { return x.trim().replace(/^"|"$/g, ""); });
    if (c.length < 2) continue;
    var date = null, name = null, val = null, unit = "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(c[0]) || /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c[0])) {
      date = detectDate(c[0]); name = c[1]; val = c[2]; unit = c[3] || "";
    } else { name = c[0]; val = c[1]; unit = c[2] || ""; }
    if (!name || num(val) == null) continue;
    var canonical = name;
    for (var a = 0; a < ALIASES.length; a++) if (ALIASES[a][2].test(name)) { canonical = ALIASES[a][0]; if (!unit) unit = ALIASES[a][1]; break; }
    out.push({ use: true, name: canonical, unit: unit, value: String(num(val)), lo: null, hi: null, date: date, raw: lines[i] });
  }
  return out;
}

/* ---------- chart ---------- */
var LABPTS = [];
/* How many numbered badges a lab chart will carry before it starts leaving
   some out, and how close two may sit before they are merged into one. A badge
   is 15px across; 18 keeps a clear gap. */
var LAB_EV_CAP = 10, LAB_EV_GAP = 18;

function labChart(m) {
  var res = markerResults(m.id);
  var W = 720, H = 300, padL = 48, padR = 16, padT = 20, padB = 38;
  var pw = W - padL - padR, ph = H - padT - padB;
  if (!res.length) return '<div class="empty">No results for ' + esc(m.name) + ' yet.</div>';

  var d0 = res[0].date, d1 = res[res.length - 1].date;
  var evsAll = changeEvents().filter(function (e) { return e.date >= d0 && e.date <= d1; });
  /* Filtering to the result span is right; drawing all of it is not. A year of
     log puts 43 numbered badges in one 720px row — 23 of the 42 adjacent pairs
     overlapping — and a 1,900px list under the chart. So keep the changes most
     likely to explain THIS marker's line (its own medicine's starts, stops and
     dose changes ahead of an unrelated diet note), cap them, and merge any that
     still land within a badge width of each other into one numbered group.
     "Show every change" puts the rest back, still grouped so nothing collides. */
  var evs = evsAll.slice().sort(function (a, b) {
    var ra = eventRank(m, a), rb = eventRank(m, b);
    if (ra !== rb) return ra - rb;
    return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;    // newer first within a rank
  });
  var shownAll = !!UI.labEvAll;
  var hidden = 0;
  if (!shownAll && evs.length > LAB_EV_CAP) { hidden = evs.length - LAB_EV_CAP; evs = evs.slice(0, LAB_EV_CAP); }
  evs.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  if (res.length === 1) { d0 = addDays(d0, -30); d1 = addDays(d1, 30); }
  var spanA = daysBetween(d0, d1) || 1;
  var padDays = Math.max(2, Math.round(spanA * 0.06));
  var xa = addDays(d0, -padDays), xb = addDays(d1, padDays), span = daysBetween(xa, xb) || 1;
  function X(dt) { return padL + (daysBetween(xa, dt) / span) * pw; }

  var vals = res.map(function (r) { return r.value; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  [m.sl, m.sh, m.fl, m.fh].forEach(function (x) { var n = num(x); if (n != null) { if (n < lo) lo = n; if (n > hi) hi = n; } });
  if (hi === lo) { hi = lo + Math.max(1, Math.abs(lo) * 0.2); lo = lo - Math.max(1, Math.abs(lo) * 0.2); }
  var rawLo = lo;
  var padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  if (rawLo >= 0 && lo < 0) lo = 0;
  if (lo > 0 && lo < (hi - lo) * 0.4) lo = 0;
  function Y(v) { return padT + (1 - (v - lo) / (hi - lo)) * ph; }
  function band(a, b) {
    var na = num(a), nb = num(b);
    if (na == null && nb == null) return null;
    var top = nb == null ? hi : nb, bot = na == null ? lo : na;
    top = clamp(top, lo, hi); bot = clamp(bot, lo, hi);
    return { y: Y(top), h: Math.max(1, Y(bot) - Y(top)) };
  }

  var s = "";
  var bs = band(m.sl, m.sh), bf = band(m.fl, m.fh);
  if (bs) s += '<rect x="' + padL + '" y="' + round(bs.y, 1) + '" width="' + pw + '" height="' + round(bs.h, 1) + '" fill="var(--surface-3)"/>';
  if (bf) s += '<rect x="' + padL + '" y="' + round(bf.y, 1) + '" width="' + pw + '" height="' + round(bf.h, 1) + '" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".95"/>';

  // y grid + labels
  for (var t = 0; t <= 4; t++) {
    var v = lo + (hi - lo) * (t / 4), y = Y(v);
    s += '<line x1="' + padL + '" y1="' + round(y, 1) + '" x2="' + (W - padR) + '" y2="' + round(y, 1) + '" stroke="var(--line)" stroke-width="1"/>';
    s += '<text x="' + (padL - 7) + '" y="' + round(y + 3.5, 1) + '" text-anchor="end">' + round(v, (hi - lo) < 5 ? 2 : (hi - lo) < 50 ? 1 : 0) + '</text>';
  }

  // event badges, grouped so two can never sit on top of each other
  var groups = [];
  evs.forEach(function (e) {
    var x = X(e.date), g = groups[groups.length - 1];
    if (g && x - g.x < LAB_EV_GAP) { g.items.push(e); return; }
    groups.push({ x: x, items: [e] });
  });
  groups.forEach(function (g, i) {
    var x = round(g.x, 1), n = g.items.length;
    s += '<line x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (padT + ph) + '" stroke="var(--flag)" stroke-width="1" stroke-dasharray="2 4" opacity="' + (n > 1 ? ".9" : ".8") + '"/>';
    s += '<circle cx="' + x + '" cy="' + (padT - 8) + '" r="' + (n > 1 ? 8.5 : 7.5) + '" fill="var(--flag)"><title>' +
      esc(g.items.map(function (e) { return fmtShort(e.date) + " — " + catLabel(e.kind) + ": " + e.label; }).join("\n")) + '</title></circle>';
    s += '<text x="' + x + '" y="' + (padT - 4.5) + '" text-anchor="middle" fill="#fff" font-size="9" pointer-events="none">' + (i + 1) + '</text>';
  });

  // line + points
  var dpath = res.map(function (r, i) { return (i ? "L" : "M") + round(X(r.date), 1) + " " + round(Y(r.value), 1); }).join(" ");
  if (res.length > 1) s += '<path d="' + dpath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  res.forEach(function (r, i) {
    var last = i === res.length - 1;
    s += '<circle cx="' + round(X(r.date), 1) + '" cy="' + round(Y(r.value), 1) + '" r="' + (last ? 5.5 : 4.2) + '" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  });
  // last value label
  var lastR = res[res.length - 1];
  var lx = X(lastR.date), ly = Y(lastR.value);
  s += '<text x="' + round(Math.min(lx + 9, W - padR - 2), 1) + '" y="' + round(ly - 9, 1) + '" text-anchor="' + (lx > W - 90 ? "end" : "start") + '" fill="var(--ink)" font-size="11">' + lastR.value + '</text>';

  // x labels
  var xt = [xa, addDays(xa, Math.round(span / 2)), xb];
  xt.forEach(function (dt, i) {
    s += '<text x="' + round(X(dt), 1) + '" y="' + (H - 14) + '" text-anchor="' + (i === 0 ? "start" : i === 2 ? "end" : "middle") + '">' + fmtShort(dt) + " '" + String(parseISO(dt).getFullYear()).slice(2) + '</text>';
  });

  LABPTS = res.map(function (r) { return { x: X(r.date), y: Y(r.value), date: r.date, value: r.value, lab: r.lab || "" }; });

  var legend = '<div class="legend">' +
    (bf ? '<span><i style="background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)"></i>Functional range ' + esc(rangeText(m.fl, m.fh)) + '</span>' : '') +
    (bs ? '<span><i style="background:var(--surface-3)"></i>Standard range ' + esc(rangeText(m.sl, m.sh)) + '</span>' : '') +
    (groups.length ? '<span><i style="background:var(--flag);border-radius:50%"></i>Change on the timeline</span>' : '') +
    '</div>';

  var evList = groups.length ? '<ol style="margin-top:10px">' + groups.map(function (g, i) {
    var lines = g.items.map(function (e) {
      return '<span class="mono dim" style="flex:none;width:52px">' + fmtShort(e.date) + '</span><span>' + esc(e.label) +
        (e.detail ? ' <span class="dim">— ' + esc(e.detail) + '</span>' : '') + '</span>';
    });
    return '<li style="display:flex;gap:8px;padding:5px 0;font-size:12.5px"><span class="mono" style="flex:none;width:20px;color:var(--flag);font-weight:500">' + (i + 1) + '</span>' +
      (lines.length === 1 ? lines[0]
        : '<span class="grow">' + g.items.map(function (e) {
            return '<span class="mono dim">' + fmtShort(e.date) + '</span> ' + esc(e.label) + (e.detail ? ' <span class="dim">— ' + esc(e.detail) + '</span>' : '');
          }).join('<br>') + '</span>') + '</li>';
  }).join("") + '</ol>' : "";
  var evNote = evsAll.length > 1
    ? '<div class="hint" style="margin-top:8px">' +
      (hidden
        ? 'Showing the ' + evs.length + ' changes most likely to matter for ' + esc(m.name) + ' — its own medication first — out of ' + evsAll.length + ' logged across this span. '
        : 'All ' + evsAll.length + ' changes logged across this span are numbered' + (groups.length < evs.length ? ', grouped where they fall on the same part of the line' : '') + '. ') +
      '<button class="btn sm ghost" data-a="labEvAll">' + (shownAll ? 'Show fewer' : 'Show every change (' + evsAll.length + ')') + '</button></div>'
    : "";

  return '<div class="chartbox" id="chartBox"><svg class="chart" id="labSvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(m.name) + ' over time">' + s + '</svg>' +
    '<div class="tip" id="labTip" hidden></div></div>' + legend + evNote + evList;
}

function wireLabChart() {
  var box = el("chartBox"), svg = el("labSvg"), tip = el("labTip");
  if (!box || !svg || !LABPTS.length) return;
  function move(ev) {
    var r = svg.getBoundingClientRect(), sx = 720 / r.width;
    var mx = (ev.clientX - r.left) * sx;
    var best = null, bd = 1e9;
    LABPTS.forEach(function (p) { var d = Math.abs(p.x - mx); if (d < bd) { bd = d; best = p; } });
    if (!best || bd > 120) { tip.hidden = true; return; }
    var m = byIdIn(STATE.markers, UI.labMarker);
    var st = m ? rangeStatus(m, best.value) : null;
    tip.innerHTML = '<div class="dim tiny">' + fmtMed(best.date) + '</div><b>' + best.value + '</b> <span class="dim tiny">' + esc(m ? m.unit : "") + '</span>' +
      (st ? '<div class="tiny" style="color:var(--' + st.k + ');margin-top:2px">' + st.t + '</div>' : "") +
      (best.lab ? '<div class="tiny dim">' + esc(best.lab) + '</div>' : "");
    tip.hidden = false;
    var px = best.x / sx, py = best.y / sx;
    tip.style.left = clamp(px - tip.offsetWidth / 2, 4, r.width - tip.offsetWidth - 4) + "px";
    tip.style.top = Math.max(2, py - tip.offsetHeight - 12) + "px";
  }
  svg.addEventListener("pointermove", move);
  svg.addEventListener("mousemove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("touchmove", function (ev) { if (ev.touches && ev.touches[0]) move(ev.touches[0]); });
  svg.addEventListener("pointerleave", function () { tip.hidden = true; });
  svg.addEventListener("mouseleave", function () { tip.hidden = true; });
}

/* ---------- view ---------- */
function viewLabs() {
  if (!STATE.markers.length) {
    return '<div class="sec" style="margin-top:14px"><span class="eyebrow">Labs</span></div>' +
      '<div class="card"><div class="empty" style="padding:32px 16px">' +
      '<div class="serif" style="font-size:19px;color:var(--ink);margin-bottom:8px">No markers set up yet</div>' +
      'Add the markers you actually get drawn, then enter your own reference ranges once.<br>They apply to every result from then on.<br>' +
      '<div class="row" style="justify-content:center;margin-top:16px">' +
      '<button class="btn pri" data-a="markerPreset">Add the standard thyroid panel</button>' +
      '<button class="btn" data-a="markerAdd">Add one marker</button></div></div></div>';
  }
  if (!UI.labMarker || !byIdIn(STATE.markers, UI.labMarker)) UI.labMarker = STATE.markers[0].id;

  var chips = STATE.markers.map(function (x) {
    var n = markerResults(x.id).length;
    return '<button class="chip n ' + (x.id === UI.labMarker ? "pc4" : "") + '" data-a="pickMarker" data-id="' + x.id + '" aria-pressed="' + (x.id === UI.labMarker ? "true" : "false") + '" style="flex:0 0 auto">' + esc(x.name) + ' <span class="dim mono" style="font-size:10px">' + n + '</span></button>';
  }).join("");

  var latest = res.length ? res[res.length - 1] : null;

  var head = '<div class="card"><div class="card-h"><h2>' + esc(m.name) + '</h2>' +
    '<span class="sub">' + (latest ? '<span class="mono" style="font-size:20px;color:var(--ink)">' + latest.value + '</span> <span class="dim">' + esc(m.unit) + '</span>' : "no results") + '</span></div>' +
    (latest ? '<div class="row" style="margin:-4px 0 14px">' +
      (st ? '<span class="pill ' + st.k + '">' + st.t + '</span>' : '<span class="pill">No range set</span>') +
      '<span class="tiny dim">drawn ' + fmtMed(latest.date) + (latest.lab ? " · " + esc(latest.lab) : "") + '</span>' +
      (delta != null ? '<span class="tiny mono" style="color:var(--ink-2)">' + (delta > 0 ? "▲ " : delta < 0 ? "▼ " : "= ") + round(Math.abs(delta), 3) + ' vs. ' + fmtShort(prev.date) + '</span>' : '') +
      '</div>' : '') +
    labChart(m) + '</div>';

  var ranges = '<div class="card"><div class="card-h"><h2>Your ranges for ' + esc(m.name) + '</h2></div>' +
    '<div class="fgrid two">' +
    '<div class="fld"><label class="f">Unit</label><input type="text" value="' + esc(m.unit) + '" data-mk="unit" data-id="' + m.id + '" placeholder="ng/dL"></div>' +
    '<div class="fld"><label class="f">Standard low</label><input type="text" inputmode="decimal" value="' + esc(m.sl) + '" data-mk="sl" data-id="' + m.id + '"></div>' +
    '<div class="fld"><label class="f">Standard high</label><input type="text" inputmode="decimal" value="' + esc(m.sh) + '" data-mk="sh" data-id="' + m.id + '"></div>' +
    '<div class="fld"><label class="f">Functional low</label><input type="text" inputmode="decimal" value="' + esc(m.fl) + '" data-mk="fl" data-id="' + m.id + '"></div>' +
    '<div class="fld"><label class="f">Functional high</label><input type="text" inputmode="decimal" value="' + esc(m.fh) + '" data-mk="fh" data-id="' + m.id + '"></div>' +
    '</div><div class="hint" style="margin-top:10px">Enter what your lab prints for the standard range, and what your RD or endo uses for the functional range. Leave a box empty to skip that edge. Nothing is assumed for you.</div>' +
    '<div class="row" style="margin-top:12px"><button class="btn sm danger" data-a="markerDel" data-id="' + m.id + '">Delete this marker</button></div></div>';

  var rows = res.slice().reverse().map(function (r) {
    var s2 = rangeStatus(m, r.value);
    return '<tr><td class="mono">' + fmtMed(r.date) + '</td><td class="num">' + r.value + '</td>' +
      '<td>' + (s2 ? '<span class="pill ' + s2.k + '">' + s2.t + '</span>' : '<span class="dim tiny">—</span>') + '</td>' +
      '<td class="tiny dim">' + esc(r.lab || "") + esc(r.note ? (r.lab ? " · " : "") + r.note : "") + '</td>' +
      '<td style="text-align:right"><button class="btn sm danger" data-a="labDel" data-id="' + r.id + '">Delete</button></td></tr>';
  }).join("");

  var table = '<div class="card flush"><div style="padding:16px 16px 0"><div class="card-h"><h2>Results</h2>' +
    '<span class="sub">' + res.length + ' for ' + esc(m.name) + '</span></div></div>' +
    (res.length ? '<div class="tblwrap"><table><thead><tr><th>Drawn</th><th class="num">Value</th><th>Status</th><th>Lab / note</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty">Nothing entered yet.</div>') + '</div>';

  var actions = '<div class="row" style="margin:14px 0">' +

    actions + head + ranges + table + '<div style="height:24px"></div>';
}

/* ============================================================
   Meds & supplements
   ============================================================ */
function adherence(s, days) {
  var to = todayISO(), from = addDays(to, -(days - 1));
  if (s.start && s.start > from) from = s.start;
  var end = s.end && s.end < to ? s.end : to;
  if (from > end) return null;
  var taken = 0, skipped = 0, unlogged = 0, n = 0;
  for (var d = from; d <= end; d = addDays(d, 1)) {
    n++;
    var day = D(d), v = day && day.supps ? day.supps[s.id] : null;
    if (v === "taken") taken++; else if (v === "skipped") skipped++; else unlogged++;
  }
  /* `taken` counts DAYS marked taken, because a day is all the model stores —
     one mark per item per day. So the expectation it is measured against has to
     be a count of days too. Expressing it in doses is what made a twice-a-day
     med read as 50% adherent on a perfect month. */
  var dpw = freqDaysPerWeek(s.freq);
  var dueDays = dpw ? Math.round((n / 7) * dpw) : null;
  return { taken: taken, skipped: skipped, unlogged: unlogged, days: n, dueDays: dueDays, perDay: freqDosesPerDay(s.freq) };
}

function suppTimeline(days) {
  if (!STATE.supps.length) return "";
  var to = todayISO(), from = addDays(to, -(days - 1)), dates = [];
  for (var d = from; d <= to; d = addDays(d, 1)) dates.push(d);
  var cols = "max-content repeat(" + dates.length + ", 15px)";
  var html = '<div class="hmwrap" data-strip="supp"><div class="hm"><div class="hm-grid" style="grid-template-columns:' + cols + '">';
  html += '<div class="hm-lbl"></div>';
  dates.forEach(function (dt, i) { html += '<div class="hm-d">' + (i % 7 === 0 ? parseISO(dt).getDate() : "") + '</div>'; });
  STATE.supps.forEach(function (s) {
    html += '<div class="hm-lbl">' + esc(s.name) + '</div>';
    dates.forEach(function (dt) {
      if (!suppActiveOn(s, dt)) { html += '<div class="hm-c" style="background:transparent;cursor:default"></div>'; return; }
      var day = D(dt), v = day && day.supps ? day.supps[s.id] : null;
      var bg = v === "taken" ? "var(--p4)" : v === "skipped" ? "var(--s4)" : "var(--surface-3)";
      html += '<button class="hm-c" data-a="openDay" data-v="' + dt + '" title="' + esc(s.name) + ' — ' + fmtMed(dt) + ': ' + (v === "taken" ? "taken" : v === "skipped" ? "missed" : "not logged") + '" style="background:' + bg + '"></button>';
    });
  });
  html += '</div></div><div class="hmfade" aria-hidden="true"></div></div>' +
    '<div class="legend"><span><i style="background:var(--p4)"></i>Taken</span><span><i style="background:var(--s4)"></i>Missed</span>' +
    '<span><i style="background:var(--surface-3)"></i>On it, not logged</span><span><i style="background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)"></i>Not on it</span></div>' +
    '<div class="hint" style="margin-top:8px">The timeline opens on today — scroll left for earlier days.</div>';
  return html;
}

function viewMeds() {
  var today = todayISO();
  var rows = STATE.supps.slice().sort(function (a, b) {
    var aa = suppActiveOn(a, today) ? 0 : 1, bb = suppActiveOn(b, today) ? 0 : 1;
    if (aa !== bb) return aa - bb;
    return (b.start || "") < (a.start || "") ? -1 : 1;
  }).map(function (s) {
    var act = suppActiveOn(s, today);
    var ad = adherence(s, 30);
    var status = act ? '<span class="pill on">On since ' + fmtShort(s.start) + '</span>'
      : s.end ? '<span class="pill">Stopped ' + fmtShort(s.end) + '</span>'
      : '<span class="pill">Starts ' + fmtShort(s.start) + '</span>';
    var adTxt = act && ad ? '<span class="tiny dim mono">' + ad.taken + ' taken · ' + ad.skipped + ' missed · ' + ad.unlogged +
      ' unlogged (30d' + (ad.dueDays != null ? ', ~' + ad.dueDays + ' days due' : '') + ')</span>' : '';
    var sd = startDose(s);
    var changed = (s.changes || []).length;
    return '<div class="supp-row med"><div class="supp-nm">' + esc(s.name) +
      '<small>' + esc([s.dose, freqLabel(s.freq)].filter(Boolean).join(" · ")) + (s.notes ? ' · ' + esc(s.notes) : '') + '</small>' +
      (adTxt ? '<div class="ad-line" style="margin-top:3px">' + adTxt + '</div>' : '') +
      (changed ? '<div class="tiny dim" style="margin-top:3px">' + changed + ' dose change' + (changed > 1 ? "s" : "") + ' logged' + (sd && sd !== s.dose ? ' · started at ' + esc(sd) : '') + '</div>' : '') +
      '</div><div class="med-act">' + status +
      '<button class="btn sm" data-a="suppEdit" data-id="' + s.id + '">Edit</button></div></div>';
  }).join("");

  return '<div class="sec" style="margin-top:14px"><span class="eyebrow">Supplements &amp; medications</span></div>' +
    '<div class="card"><div class="card-h"><h2>Your list</h2>' +
    '<span class="sub"><button class="btn sm pri" data-a="suppAdd">Add item</button></span></div>' +
    (rows || '<div class="empty">Nothing yet. Each supplement or med is its own item with a start date, an optional end date, and how often you mean to take it.<br>' +
      '<button class="btn pri" data-a="suppAdd" style="margin-top:12px">Add your first one</button></div>') +
    (STATE.supps.length ? '<div class="hint" style="margin-top:12px">Stopping something sets an end date instead of deleting it — the history stays, and the gap shows up on the timeline and on every lab chart.<br>' +
      'A day is marked taken or missed as a whole day, so for a twice-a-day item one mark covers both doses — the count above is days, not doses.</div>' : '') +
    '</div>' +
    (STATE.supps.length ? '<div class="card"><div class="card-h"><h2>Timeline</h2><span class="sub">last 60 days</span></div>' + suppTimeline(60) + '</div>' : '') +
    '<div style="height:24px"></div>';
}

/* ============================================================
   Appointment summary
   ============================================================ */
function summaryPeriod() {
  var appts = STATE.appts.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var last = null;
  for (var i = 0; i < appts.length; i++) if (appts[i].date <= todayISO()) last = appts[i];
  var from = last ? last.date : addDays(todayISO(), -59);
  return { from: from, to: todayISO(), since: last };
}

function topMovers(from, to) {
  var span = daysBetween(from, to) + 1;
  var pFrom = addDays(from, -span), pTo = addDays(from, -1);
  var out = [];
  activeSymptoms().forEach(function (s) {
    var cur = meanOf(seriesFor(s.id, from, to));
    var prev = meanOf(seriesFor(s.id, pFrom, pTo));
    if (cur.n < 3) return;
    out.push({ s: s, cur: cur, prev: prev, delta: prev.n >= 3 ? cur.mean - prev.mean : null });
  });
  return out;
}

function viewSummary() {
  var P = summaryPeriod(), from = P.from, to = P.to;
  var movers = topMovers(from, to);
  var withDelta = movers.filter(function (m) { return m.delta != null && Math.abs(m.delta) >= 0.3; })
    .sort(function (a, b) { return Math.abs(b.delta) - Math.abs(a.delta); });
  var worst = movers.filter(function (m) { return m.s.scale === "sev"; })
    .sort(function (a, b) { return b.cur.mean - a.cur.mean; }).slice(0, 5);

  var evs = changeEvents().filter(function (e) { return e.date >= from && e.date <= to; });
  var cov = (function () {
    var n = 0, t = 0;
    for (var d = from; d <= to; d = addDays(d, 1)) { t++; if (dayHasAnything(D(d))) n++; }
    return { n: n, t: t };
  })();

  var changeHtml = evs.length ? '<ul>' + evs.map(function (e) {
    return '<li><b>' + fmtMed(e.date) + '</b> — ' + esc(e.label) + (e.detail ? ' <span class="dim">(' + esc(e.detail) + ')</span>' : '') + '</li>';
  }).join("") + '</ul>' : '<p class="dim">No changes logged in this period.</p>';

  var moverHtml = withDelta.length ? '<ul>' + withDelta.slice(0, 8).map(function (m) {
    var better = m.s.scale === "pos" ? m.delta > 0 : m.s.scale === "div" ? Math.abs(m.cur.mean - 3) < Math.abs(m.prev.mean - 3) : m.delta < 0;
    return '<li>' + esc(m.s.name) + ' — ' + round(m.prev.mean, 1) + ' → <b>' + round(m.cur.mean, 1) + '</b> ' +
      '<span style="color:var(--' + (better ? "good" : "crit") + ')">(' + (better ? "better" : "worse") + ')</span> ' +
      '<span class="dim tiny">' + m.cur.n + ' days logged</span></li>';
  }).join("") + '</ul>' : '<p class="dim">Not enough logged days in both this period and the one before it to compare yet.</p>';

  var worstHtml = worst.length ? '<ul>' + worst.map(function (m) {
    return '<li>' + esc(m.s.name) + ' — average <b>' + round(m.cur.mean, 1) + '</b> of 5 across ' + m.cur.n + ' days' +
      (m.cur.n ? ', ' + Math.round(100 * seriesFor(m.s.id, from, to).filter(function (p) { return p.v >= 3; }).length / m.cur.n) + '% of logged days at moderate or worse' : '') + '</li>';
  }).join("") + '</ul>' : '<p class="dim">No severity-rated symptoms logged in this period.</p>';

  var labHtml = "";
  if (STATE.markers.length) {
    var lrows = STATE.markers.map(function (m) {
      var res = markerResults(m.id);
      if (!res.length) return "";
      var last = res[res.length - 1], prev = res.length > 1 ? res[res.length - 2] : null;
      var st = rangeStatus(m, last.value);
      return '<tr><td>' + esc(m.name) + '</td><td class="num">' + last.value + ' <span class="dim">' + esc(m.unit) + '</span></td>' +
        '<td class="mono tiny">' + fmtShort(last.date) + '</td>' +
        '<td class="num tiny">' + (prev ? signed(last.value - prev.value) + ' vs ' + fmtShort(prev.date) : '—') + '</td>' +
        '<td class="tiny' + (m.sl || m.sh ? '' : ' dim') + '">' + esc(rangeText(m.sl, m.sh)) + '</td>' +
        '<td class="tiny' + (m.fl || m.fh ? '' : ' dim') + '">' + esc(rangeText(m.fl, m.fh)) + '</td>' +
        '<td>' + (st ? '<span class="pill ' + st.k + '">' + st.t + '</span>' : '<span class="dim">—</span>') + '</td></tr>';
    }).filter(Boolean).join("");
    labHtml = lrows ? '<div class="tblwrap"><table><thead><tr><th>Marker</th><th class="num">Latest</th><th>Drawn</th><th class="num">Change</th><th>Standard</th><th>Functional</th><th>Status</th></tr></thead><tbody>' + lrows + '</tbody></table></div>'
      : '<p class="dim">No results entered yet.</p>';
  } else labHtml = '<p class="dim">No markers set up yet.</p>';

  var onNow = suppsOn(to);
  var suppHtml = onNow.length ? '<ul>' + onNow.map(function (s) {
    var ad = adherence(s, Math.min(90, daysBetween(from, to) + 1));
    var sd = startDose(s);
    var moved = !!(sd && sd !== s.dose);
    return '<li>' + esc(s.name) + (s.dose ? ', ' + esc(s.dose) + (moved ? ' now' : '') : '') + ' — ' + esc(freqLabel(s.freq)) + ', since ' + fmtMed(s.start) +
      (moved ? ' (started at ' + esc(sd) + ')' : '') +
      (ad ? ' <span class="dim tiny">(' + ad.taken + ' taken / ' + ad.skipped + ' missed / ' + ad.unlogged + ' unlogged over ' + ad.days + ' days' +
        (ad.dueDays != null ? '; ~' + ad.dueDays + ' days due' : '') + ')</span>' : '') + '</li>';
  }).join("") + '</ul>' : '<p class="dim">Nothing active.</p>';

  var stopped = STATE.supps.filter(function (s) { return s.end && s.end >= from && s.end <= to; });
  if (stopped.length) suppHtml += '<p style="margin-top:8px"><b>Stopped this period:</b> ' + stopped.map(function (s) { return esc(s.name) + " (" + fmtShort(s.end) + ")"; }).join(", ") + '</p>';

  /* Cycle length is start to next start; period length is how long the
     bleeding lasted. Both are printed, and named, because they are different
     numbers and an endocrinologist reads them differently. */
  var sortedCyc = cyclesSorted();
  var cyc = sortedCyc.filter(function (c) { return c.start >= from && c.start <= to; });
  var lens = [], plens = [];
  sortedCyc.forEach(function (c, i, arr) {
    if (i > 0) lens.push(daysBetween(arr[i - 1].start, c.start));
    var pl = periodLength(c);
    if (pl) plens.push(pl);
  });
  function avg(a) { return Math.round(a.reduce(function (x, y) { return x + y; }, 0) / a.length); }
  var cycHtml = STATE.cycles.length
    ? '<p>' + (cyc.length
        ? cyc.length + ' period' + (cyc.length === 1 ? "" : "s") + ' began between ' + fmtMed(from) + ' and ' + fmtMed(to) +
          ' (' + cyc.map(function (c) { return fmtShort(c.start) + (c.end ? "–" + fmtShort(c.end) : ""); }).join(", ") + ')'
        : 'No period began between ' + fmtMed(from) + ' and ' + fmtMed(to)) +
      (lens.length ? '. Average cycle length, start to next start, across all ' + sortedCyc.length + ' logged cycles: <b>' + avg(lens) + ' days</b>' : '') +
      (plens.length ? '. Average period length, bleeding, across the ' + plens.length + ' with an end logged: <b>' + avg(plens) + ' days</b>' : '') + '.</p>'
    : '<p class="dim">No cycles logged.</p>';

  var qHtml = STATE.questions.length ? '<ul>' + STATE.questions.map(function (q) {
    return '<li style="display:flex;gap:8px;align-items:flex-start"><span class="grow">' + esc(q.text) + '</span>' +
      '<button class="btn sm ghost noprint" data-a="qDel" data-id="' + q.id + '">Remove</button></li>';
  }).join("") + '</ul>' : '<p class="dim">Nothing yet.</p>';

  var apptOpts = STATE.appts.slice().sort(function (a, b) { return b.date < a.date ? -1 : 1; });

  return '<div class="sec" style="margin-top:14px"><span class="eyebrow">For your appointment</span></div>' +
    '<div class="row noprint" style="margin-bottom:14px">' +
    '<button class="btn pri" data-a="print">Print / save as PDF</button>' +
    '<button class="btn" data-a="copySummary">Copy as text</button>' +
    '<button class="btn" data-a="qAdd">Add a question</button>' +
    '<button class="btn ghost" data-a="apptAdd">Mark an appointment</button></div>' +
    (apptOpts.length ? '' : '<div class="hint noprint" style="margin-bottom:14px">Mark an appointment date and this page will cover everything since that visit. Until then it covers the last 60 days.</div>') +
    '<div class="report" id="reportEl">' +
      '<div class="eyebrow">Pre-visit summary</div>' +
      '<h1>' + (STATE.profile.name ? esc(STATE.profile.name) + " — " : "") + 'Hashimoto’s tracking</h1>' +
      '<div class="rmeta">' + fmtMed(from) + ' – ' + fmtMed(to) + ' · ' + (daysBetween(from, to) + 1) + ' days · ' + cov.n + ' day' + (cov.n === 1 ? "" : "s") + ' with entries' +
      (P.since ? ' · since visit with ' + esc(P.since.who || "clinician") : '') + '</div>' +
      '<div class="rrule"></div>' +
      /* Each heading travels with its own block inside one .rsec, which is what
         the print stylesheet keeps whole. Before this the sections were loose
         siblings and nothing could stop Labs or Questions to ask from breaking
         across a page. */
      rsec("What changed", changeHtml) +
      rsec("Symptoms that moved most", moverHtml) +
      rsec("Where things sit now", worstHtml) +
      rsec("Labs", labHtml) +
      rsec("Supplements &amp; medications", suppHtml) +
      rsec("Cycle", cycHtml) +
      rsec("Questions to ask", qHtml) +
      '<p class="rmeta" style="margin-top:22px">Self-reported daily ratings on a 1–5 scale. Averages exclude days that were never logged. Timing overlaps are associations, not causes.</p>' +
    '</div><div style="height:24px"></div>';
}

/* one printed section: heading plus its block, kept together on the page */
function rsec(title, body) { return '<section class="rsec"><h2>' + title + '</h2>' + body + '</section>'; }

function summaryText() {
  var r = el("reportEl");
  if (!r) return "";
  var t = r.innerText || r.textContent || "";
  return t.replace(/\n{3,}/g, "\n\n").trim();
}

  return html;
}

    }).join("") + '</tbody></table></div>';
